<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>دموی قرارداد API — CampusGuide ساختگی</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; line-height: 1.7; background: #f5f8fc; color: #14243b; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 1rem; }
    main { width: min(100%, 48rem); margin: 2rem auto; padding: clamp(1rem, 4vw, 2rem); background: #fff; border: 1px solid #d7e0ec; border-radius: 1rem; box-shadow: 0 0.5rem 1.5rem #14243b12; }
    h1, h2 { line-height: 1.3; }
    label { display: block; margin-block: 1rem 0.35rem; font-weight: 700; }
    textarea { display: block; width: 100%; min-height: 8rem; padding: 0.75rem; border: 2px solid #62748b; border-radius: 0.5rem; font: inherit; resize: vertical; }
    textarea:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid #d05a00; outline-offset: 3px; }
    button { min-height: 2.75rem; margin-block-start: 0.75rem; padding: 0.55rem 1.1rem; border: 0; border-radius: 0.5rem; background: #155a76; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { cursor: wait; opacity: 0.72; }
    .notice { padding: 0.75rem 1rem; border-inline-start: 0.3rem solid #155a76; background: #edf6fa; }
    .answer { margin-block-start: 1rem; padding: 1rem; border: 1px solid #9bb7c7; border-radius: 0.5rem; overflow-wrap: anywhere; }
    [hidden] { display: none !important; }
    a { color: #064f72; text-decoration-thickness: 0.12em; text-underline-offset: 0.18em; }
    @media (max-width: 24rem) { body { padding: 0.5rem; } main { margin-block: 0.5rem; border-radius: 0.5rem; } button { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <h1>دموی رابطِ قرارداد API</h1>
    <p class="notice">این نمونه از fixture ساختگی استفاده می‌کند؛ مدل زنده، دادهٔ کاربر و سرویس بیرونی ندارد.</p>
    <form id="assist-form">
      <label for="question">پرسش کوتاه و غیرشخصی</label>
      <textarea id="question" name="question" maxlength="300" required aria-describedby="question-help"></textarea>
      <p id="question-help">حداکثر ۳۰۰ نویسه؛ اطلاعات شناسایی‌کننده وارد نکنید.</p>
      <button id="submit-button" type="submit">دریافت پاسخِ نمایشی</button>
    </form>
    <p id="status" role="status" aria-live="polite">برای شروع، پرسش را وارد کنید.</p>
    <p id="error" role="alert" hidden></p>
    <section id="answer" class="answer" aria-labelledby="answer-heading" hidden>
      <h2 id="answer-heading">پاسخ نمونه</h2>
      <p id="answer-text"></p>
      <h3>منبع ساختگی</h3>
      <ul id="sources"></ul>
    </section>
  </main>
  <script>
    const form = document.querySelector('#assist-form');
    const question = document.querySelector('#question');
    const button = document.querySelector('#submit-button');
    const statusLine = document.querySelector('#status');
    const errorLine = document.querySelector('#error');
    const answerPanel = document.querySelector('#answer');
    const answerText = document.querySelector('#answer-text');
    const sources = document.querySelector('#sources');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorLine.hidden = true;
      answerPanel.hidden = true;
      answerText.textContent = '';
      sources.replaceChildren();
      button.disabled = true;
      statusLine.textContent = 'در حال ارسال…';
      try {
        const response = await fetch('/v1/assist', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json, application/problem+json' },
          body: JSON.stringify({ question: question.value, locale: 'fa' })
        });
        const body = await response.json();
        if (!response.ok || typeof body.answer !== 'string' || !Array.isArray(body.sources)) {
          throw new Error('api-problem');
        }
        answerText.textContent = body.answer;
        for (const source of body.sources) {
          const item = document.createElement('li');
          item.textContent = `${source.title} (${source.id})`;
          sources.append(item);
        }
        answerPanel.hidden = false;
        statusLine.textContent = 'پاسخ آماده است.';
      } catch (_error) {
        errorLine.textContent = 'پاسخ در دسترس نیست؛ بعداً دوباره تلاش کنید.';
        errorLine.hidden = false;
        statusLine.textContent = 'درخواست کامل نشد.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
