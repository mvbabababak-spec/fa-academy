<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">دروازهٔ ممیزی پیکره، کیفیت و آلودگی ارزیابی</title>
  <desc id="desc">جریان داده از منشأ و بررسی حقوق به کنترل کیفیت، حذف نامزدهای تکرار، غربال هم‌پوشانی benchmark، بررسی انسانی و کارت دادهٔ نسخه‌دار. هیچ ماشینی مجوز یا نبود آلودگی را تضمین نمی‌کند.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f8ff"/><stop offset="1" stop-color="#e8f2f1"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17345b"/><stop offset="1" stop-color="#24547a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17345b" flood-opacity=".13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53728d"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c98227"/></marker>
    <style>
      text{font-family:Arial,"Noto Sans Arabic","Noto Sans",sans-serif;fill:#17314d}
      .rtl{direction:rtl;unicode-bidi:plaintext}
      .title{font-size:39px;font-weight:800;fill:#fff}
      .subtitle{font-size:20px;fill:#d8e6f2}
      .stage{font-size:25px;font-weight:800}
      .body{font-size:18px}
      .small{font-size:16px}
      .badge{font-size:15px;font-weight:700}
      .looptitle{font-size:23px;font-weight:800}
      .loopbody{font-size:18px}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect x="50" y="42" width="1500" height="116" rx="26" fill="url(#navy)"/>
  <text x="800" y="94" text-anchor="middle" class="title rtl">دروازهٔ ممیزی پیکره</text>
  <text x="800" y="130" text-anchor="middle" class="subtitle rtl">از منشأ و کیفیت تا تکرار، آلودگی ارزیابی و ثبت نسخه</text>

  <g filter="url(#shadow)">
    <rect x="1240" y="220" width="285" height="274" rx="24" fill="#fff" stroke="#87a6c2" stroke-width="2"/>
    <rect x="905" y="220" width="285" height="274" rx="24" fill="#fff" stroke="#6ba99d" stroke-width="2"/>
    <rect x="570" y="220" width="285" height="274" rx="24" fill="#fff" stroke="#d6aa61" stroke-width="2"/>
    <rect x="235" y="220" width="285" height="274" rx="24" fill="#fff" stroke="#779bc2" stroke-width="2"/>
  </g>

  <circle cx="1465" cy="260" r="20" fill="#e7f0fb"/><text x="1465" y="267" text-anchor="middle" class="badge">۱</text>
  <text x="1382" y="310" text-anchor="middle" class="stage rtl">منشأ و حقوق</text>
  <text x="1382" y="352" text-anchor="middle" class="body rtl">منبع • نسخه • مجوز</text>
  <text x="1382" y="383" text-anchor="middle" class="body rtl">شاهد • کاربرد • تاریخ</text>
  <text x="1382" y="435" text-anchor="middle" class="small rtl" fill="#526c82">شناسه ≠ تأیید حقوق</text>
  <rect x="1280" y="455" width="205" height="24" rx="12" fill="#edf3f8"/><text x="1382" y="472" text-anchor="middle" class="badge rtl">ثبت lineage</text>

  <circle cx="1130" cy="260" r="20" fill="#e7f6f2"/><text x="1130" y="267" text-anchor="middle" class="badge">۲</text>
  <text x="1047" y="310" text-anchor="middle" class="stage rtl">کیفیت و پوشش</text>
  <text x="1047" y="352" text-anchor="middle" class="body rtl">هدف‌محور • سنجش‌پذیر</text>
  <text x="1047" y="383" text-anchor="middle" class="body rtl">پرچم → بازبینی</text>
  <text x="1047" y="435" text-anchor="middle" class="small rtl" fill="#526c82">فیلترها فرضیه‌اند</text>
  <rect x="945" y="455" width="205" height="24" rx="12" fill="#e9f5f1"/><text x="1047" y="472" text-anchor="middle" class="badge rtl">پوشش + خطا</text>

  <circle cx="795" cy="260" r="20" fill="#fff3df"/><text x="795" y="267" text-anchor="middle" class="badge">۳</text>
  <text x="712" y="310" text-anchor="middle" class="stage rtl">تکرار و نشت</text>
  <text x="712" y="352" text-anchor="middle" class="body rtl">دقیق • نزدیک</text>
  <text x="712" y="383" text-anchor="middle" class="body rtl">هم‌پوشانی ارزیابی</text>
  <text x="712" y="435" text-anchor="middle" class="small rtl" fill="#526c82">نامزد ≠ اثبات</text>
  <rect x="610" y="455" width="205" height="24" rx="12" fill="#fff5e6"/><text x="712" y="472" text-anchor="middle" class="badge rtl">خوشه + شاهد</text>

  <circle cx="460" cy="260" r="20" fill="#f0eafa"/><text x="460" y="267" text-anchor="middle" class="badge">۴</text>
  <text x="377" y="310" text-anchor="middle" class="stage rtl">تصمیم انسانی</text>
  <text x="377" y="352" text-anchor="middle" class="body rtl">شامل • نگه‌دار</text>
  <text x="377" y="383" text-anchor="middle" class="body rtl">بازبینی • کنارگذاری</text>
  <text x="377" y="435" text-anchor="middle" class="small rtl" fill="#526c82">هیچ حذف خودکار</text>
  <rect x="275" y="455" width="205" height="24" rx="12" fill="#f2edf9"/><text x="377" y="472" text-anchor="middle" class="badge rtl">ثبت دلیل</text>

  <path d="M1240 355H1198" stroke="#53728d" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M905 355H863" stroke="#53728d" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M570 355H528" stroke="#53728d" stroke-width="5" marker-end="url(#arrow)"/>

  <path d="M1380 523V574H1220" fill="none" stroke="#c98227" stroke-width="4" marker-end="url(#arrowAmber)"/>
  <rect x="790" y="548" width="400" height="56" rx="18" fill="#fff3dd" stroke="#d39a45" stroke-width="2"/>
  <text x="990" y="584" text-anchor="middle" class="body rtl" font-weight="700">اطلاعات ناکافی؟ توقف و بررسی انسانی</text>
  <path d="M790 576H740" fill="none" stroke="#c98227" stroke-width="4" marker-end="url(#arrowAmber)"/>
  <rect x="450" y="548" width="275" height="56" rx="18" fill="#fff" stroke="#d39a45" stroke-width="2"/>
  <text x="587" y="584" text-anchor="middle" class="body rtl">ثبت hold / دلیل حذف</text>

  <rect x="76" y="690" width="1448" height="232" rx="27" fill="#fff" stroke="#bed1de" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="740" text-anchor="middle" class="looptitle rtl">حلقهٔ انتخاب فیلتر: اندازه‌گیری، مقایسه، مستندسازی</text>
  <path d="M350 820H550" stroke="#89a2b4" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M680 820H875" stroke="#89a2b4" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1005 820H1200" stroke="#89a2b4" stroke-width="4" marker-end="url(#arrow)"/>
  <circle cx="280" cy="820" r="48" fill="#e8f1fa"/><text x="280" y="827" text-anchor="middle" class="badge rtl">هدف + baseline</text>
  <circle cx="610" cy="820" r="48" fill="#e5f4ef"/><text x="610" y="827" text-anchor="middle" class="badge rtl">فیلتر + ablation</text>
  <circle cx="935" cy="820" r="48" fill="#fff2dc"/><text x="935" y="827" text-anchor="middle" class="badge rtl">eval مستقل</text>
  <circle cx="1260" cy="820" r="48" fill="#f0eafa"/><text x="1260" y="827" text-anchor="middle" class="badge rtl">کارت + نسخه</text>
  <text x="800" y="894" text-anchor="middle" class="small rtl" fill="#536d82">شاخص‌های سطحی نقاط شروع‌اند؛ آستانه، دامنه و اثر بر گروه‌ها را با دادهٔ همان وظیفه بسنجید.</text>
</svg>
