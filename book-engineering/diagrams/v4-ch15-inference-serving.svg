<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Inference runtime and benchmark evidence flow</title>
  <desc id="desc">A left-to-right flow connects model artifacts, export and packaging, inference runtime scheduling, and measured traces. A lower lane names optimization levers and warns that measurements depend on the model, hardware, versions, and workload.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#253449"/>
    </marker>
    <style>
      .box { fill:#f5f8fc; stroke:#253449; stroke-width:3; rx:22; }
      .head { font:700 30px sans-serif; fill:#162538; text-anchor:middle; }
      .latin { font:600 24px sans-serif; fill:#24384d; text-anchor:middle; }
      .fa { font:500 24px sans-serif; fill:#28394b; text-anchor:middle; }
      .small { font:500 21px sans-serif; fill:#24384d; text-anchor:middle; }
      .arrow { stroke:#253449; stroke-width:5; fill:none; marker-end:url(#arrow); }
      .lane { fill:#edf4f5; stroke:#2a625a; stroke-width:3; rx:20; }
      .warn { fill:#fff7e8; stroke:#986420; stroke-width:3; rx:20; }
      .divider { stroke:#b7c4cf; stroke-width:2; stroke-dasharray:8 8; }
    </style>
  </defs>
  <rect x="0" y="0" width="1600" height="1000" fill="#ffffff"/>
  <text x="800" y="58" class="head">مسیر مدل تا شاهد کارایی</text>
  <text x="800" y="92" class="small">شکل ۴-۱۵-۱</text>

  <rect x="45" y="155" width="330" height="310" class="box"/>
  <text x="210" y="205" class="head">Model artifact</text>
  <text x="210" y="252" class="latin">Weights • Config • Tokenizer</text>
  <text x="210" y="310" class="fa">وزن و پیکربندی</text>
  <text x="210" y="347" class="fa">هم‌ترازی واژه‌ساز و الگوی گفتگو</text>
  <text x="210" y="410" class="small">Revision and hashes</text>

  <rect x="425" y="155" width="330" height="310" class="box"/>
  <text x="590" y="205" class="head">Export / Package</text>
  <text x="590" y="252" class="latin">Safetensors • GGUF • ONNX</text>
  <text x="590" y="290" class="latin">TensorRT engine</text>
  <text x="590" y="347" class="fa">قالب با پشتیبانی وابسته</text>
  <text x="590" y="384" class="fa">تبدیل می‌تواند محدودیت بسازد</text>
  <text x="590" y="427" class="small">Model and hardware tuple</text>

  <rect x="805" y="155" width="330" height="310" class="box"/>
  <text x="970" y="205" class="head">Inference runtime</text>
  <text x="970" y="252" class="latin">vLLM • llama.cpp • Ollama</text>
  <text x="970" y="290" class="latin">ONNX Runtime • TensorRT-LLM</text>
  <text x="970" y="347" class="fa">صف و زمان‌بند</text>
  <text x="970" y="384" class="latin">Prefill • Decode • KV cache</text>
  <text x="970" y="427" class="fa">بچ‌بندی و پذیرش درخواست</text>

  <rect x="1185" y="155" width="370" height="310" class="box"/>
  <text x="1370" y="205" class="head">Trace / Evaluation</text>
  <text x="1370" y="252" class="latin">TTFT • TPOT • p95 • tok/s</text>
  <text x="1370" y="290" class="latin">Errors • Memory • Quality</text>
  <text x="1370" y="347" class="fa">ورودی و خروجی ثابت</text>
  <text x="1370" y="384" class="fa">زمان‌بندی و بار مشخص</text>
  <text x="1370" y="427" class="fa">نتیجه فقط در همین دامنه</text>

  <path d="M375 310 H415" class="arrow"/>
  <path d="M755 310 H795" class="arrow"/>
  <path d="M1135 310 H1175" class="arrow"/>

  <line x1="55" y1="520" x2="1545" y2="520" class="divider"/>
  <rect x="70" y="565" width="710" height="260" class="lane"/>
  <text x="425" y="615" class="head">Optimization levers</text>
  <text x="425" y="670" class="latin">Weight / KV quantization</text>
  <text x="425" y="712" class="latin">Continuous batching • Prefix cache</text>
  <text x="425" y="754" class="latin">Speculative decoding</text>
  <text x="425" y="798" class="fa">هر اهرم باید جداگانه و روی همان کار سنجیده شود</text>

  <rect x="820" y="565" width="710" height="260" class="warn"/>
  <text x="1175" y="615" class="head">Evidence boundary</text>
  <text x="1175" y="670" class="latin">Model • Runtime • Driver • Hardware</text>
  <text x="1175" y="712" class="latin">Versions • Precision • Workload • SLO</text>
  <text x="1175" y="762" class="fa">یک ردگیری کوچک، آزمون سنجش عمومی نیست</text>
  <text x="1175" y="800" class="fa">کیفیت مدل باید مستقل ارزیابی شود</text>

  <text x="800" y="905" class="small">A format conversion or runtime change does not by itself prove quality or speed.</text>
  <text x="800" y="945" class="fa">پیکان‌ها ترتیب فرایند را نشان می‌دهند، نه تضمین سازگاری یا بهبود کارایی</text>
</svg>
