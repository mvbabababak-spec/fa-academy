<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:lang="fa" role="img" aria-labelledby="v5ch08-title v5ch08-desc" width="1200" height="680" viewBox="0 0 1200 680">
  <title id="v5ch08-title" xml:lang="fa">مسیر انتشار نسخه و بازگشت کنترل‌شده</title>
  <desc id="v5ch08-desc" xml:lang="fa">شش گام از راست به چپ: commit نسخه‌بندی‌شده، CI و آزمون، ساخت artifact با digest و provenance، staging، canary و gate سلامت، و production. پیکان پیوسته promotion را نشان می‌دهد. اگر gate شکست بخورد، پیکان خط‌چین promotion را متوقف می‌کند و traffic را به نسخهٔ پایدار قبلی برمی‌گرداند. شماره‌ها و برچسب‌ها معنا را مستقل از رنگ بیان می‌کنند.</desc>
  <defs>
    <marker id="v5ch08-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <pattern id="v5ch08-dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#374151"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1200" height="680" fill="#ffffff"/>
  <text x="600" y="62" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="sans-serif" font-size="30" font-weight="700" fill="#111827" xml:lang="fa">از commit تا rollout کنترل‌شده</text>
  <text x="600" y="105" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="sans-serif" font-size="18" fill="#374151" xml:lang="fa">یک artifact ثابت؛ هر مرحله با شاهد و gate مستقل</text>

  <g stroke="#111827" stroke-width="3" fill="#ffffff">
    <rect x="975" y="155" width="155" height="170" rx="12"/>
    <rect x="795" y="155" width="155" height="170" rx="12" fill="url(#v5ch08-dots)" fill-opacity="0.16"/>
    <rect x="615" y="155" width="155" height="170" rx="12"/>
    <rect x="435" y="155" width="155" height="170" rx="12" fill="url(#v5ch08-dots)" fill-opacity="0.16"/>
    <rect x="255" y="155" width="155" height="170" rx="12"/>
    <rect x="75" y="155" width="155" height="170" rx="12" fill="url(#v5ch08-dots)" fill-opacity="0.16"/>
  </g>

  <g font-family="sans-serif" fill="#111827" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" xml:lang="fa">
    <text x="1052" y="194" font-size="19" font-weight="700">۱ — منبع</text>
    <text x="1052" y="232" font-size="17">commit پایدار</text>
    <text x="1052" y="264" font-size="17">review و تغییر کوچک</text>
    <text x="872" y="194" font-size="19" font-weight="700">۲ — CI</text>
    <text x="872" y="232" font-size="17">build و آزمون</text>
    <text x="872" y="264" font-size="17">gateهای خودکار</text>
    <text x="692" y="194" font-size="19" font-weight="700">۳ — artifact</text>
    <text x="692" y="232" font-size="17">digest ثابت</text>
    <text x="692" y="264" font-size="17">provenance بررسی‌شده</text>
    <text x="512" y="194" font-size="19" font-weight="700">۴ — staging</text>
    <text x="512" y="232" font-size="17">contract و smoke</text>
    <text x="512" y="264" font-size="17">تنظیم محیط</text>
    <text x="332" y="194" font-size="19" font-weight="700">۵ — canary</text>
    <text x="332" y="232" font-size="17">traffic محدود</text>
    <text x="332" y="264" font-size="17">gate سلامت و کیفیت</text>
    <text x="152" y="194" font-size="19" font-weight="700">۶ — production</text>
    <text x="152" y="232" font-size="17">promotion تدریجی</text>
    <text x="152" y="264" font-size="17">پایش و مالک مشخص</text>
  </g>

  <g fill="none" stroke="#111827" stroke-width="3" marker-end="url(#v5ch08-arrow)">
    <path d="M 975 240 L 951 240"/>
    <path d="M 795 240 L 771 240"/>
    <path d="M 615 240 L 591 240"/>
    <path d="M 435 240 L 411 240"/>
    <path d="M 255 240 L 231 240"/>
  </g>

  <rect x="420" y="430" width="360" height="92" rx="12" fill="#ffffff" stroke="#111827" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="600" y="466" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="sans-serif" font-size="19" font-weight="700" fill="#111827" xml:lang="fa">شکست gate: promotion متوقف می‌شود</text>
  <text x="600" y="498" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="sans-serif" font-size="17" fill="#111827" xml:lang="fa">نسخهٔ قبلی و مسیر بازگشت باید آماده باشند</text>

  <path d="M 152 325 L 152 578 L 902 578" fill="none" stroke="#111827" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#v5ch08-arrow)"/>
  <text x="530" y="558" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="sans-serif" font-size="16" fill="#111827" xml:lang="fa">مسیر برگشت به artifact پایدار</text>
  <rect x="902" y="548" width="292" height="58" rx="10" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="1048" y="584" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="sans-serif" font-size="18" fill="#111827" xml:lang="fa">digest پایدارِ پیشین</text>
  <text x="600" y="645" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="sans-serif" font-size="16" fill="#374151" xml:lang="fa">پیکان پیوسته: جلو؛ پیکان خط‌چین: توقف و بازگشت به نسخهٔ قبلی</text>
</svg>
