<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">چرخهٔ پیش‌آموزش، نرخ یادگیری و checkpoint قابل‌بازیابی</title>
  <desc id="desc">جریان دادهٔ train از microbatch و gradient accumulation به یک optimizer update؛ نمودار warmup خطی و cosine decay برحسب update؛ checkpoint اتمی با وضعیت مدل، optimizer، schedule، sampler، RNG و hash داده، سپس امکان resume. Validation برای پایش است و test پس از تکمیل run یک‌بار ارزیابی می‌شود.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3f8ff"/><stop offset="1" stop-color="#eaf4ef"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16375d"/><stop offset="1" stop-color="#285b80"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17345b" flood-opacity=".14"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52738e"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#348b78"/></marker>
    <style>
      text{font-family:Arial,"Noto Sans Arabic","Noto Sans",sans-serif;fill:#17314d}
      .rtl{direction:rtl;unicode-bidi:plaintext}
      .title{font-size:39px;font-weight:800;fill:#fff}
      .subtitle{font-size:20px;fill:#d9e8f2}
      .stage{font-size:25px;font-weight:800}
      .body{font-size:19px}
      .small{font-size:16px}
      .badge{font-size:16px;font-weight:700}
      .paneltitle{font-size:24px;font-weight:800}
      .math{font-size:19px;font-weight:700}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect x="50" y="38" width="1500" height="118" rx="26" fill="url(#navy)"/>
  <text x="800" y="91" text-anchor="middle" class="title rtl">پیش‌آموزشِ قابل‌بازگشت</text>
  <text x="800" y="130" text-anchor="middle" class="subtitle rtl">بودجه برحسب update • schedule روشن • checkpoint با وضعیت کامل</text>

  <g filter="url(#shadow)">
    <rect x="1235" y="202" width="300" height="188" rx="24" fill="#fff" stroke="#7698ba" stroke-width="2"/>
    <rect x="875" y="202" width="300" height="188" rx="24" fill="#fff" stroke="#67a394" stroke-width="2"/>
    <rect x="515" y="202" width="300" height="188" rx="24" fill="#fff" stroke="#d2a55e" stroke-width="2"/>
    <rect x="155" y="202" width="300" height="188" rx="24" fill="#fff" stroke="#789bbd" stroke-width="2"/>
  </g>
  <circle cx="1490" cy="240" r="20" fill="#e9f1fa"/><text x="1490" y="247" text-anchor="middle" class="badge">۱</text>
  <text x="1385" y="292" text-anchor="middle" class="stage rtl">train + نسخه</text>
  <text x="1385" y="330" text-anchor="middle" class="body rtl">hash پیکره و split</text>
  <text x="1385" y="360" text-anchor="middle" class="small rtl">test جدا نگه داشته می‌شود</text>

  <circle cx="1130" cy="240" r="20" fill="#e5f5ef"/><text x="1130" y="247" text-anchor="middle" class="badge">۲</text>
  <text x="1025" y="292" text-anchor="middle" class="stage rtl">microbatch</text>
  <text x="1025" y="330" text-anchor="middle" class="body rtl">نمونه‌ها ← targetها</text>
  <text x="1025" y="360" text-anchor="middle" class="small rtl">مرز رکورد حفظ می‌شود</text>

  <circle cx="770" cy="240" r="20" fill="#fff2df"/><text x="770" y="247" text-anchor="middle" class="badge">۳</text>
  <text x="665" y="292" text-anchor="middle" class="stage rtl">تجمع گرادیان</text>
  <text x="665" y="330" text-anchor="middle" class="body rtl">میانگین بر target معتبر</text>
  <text x="665" y="360" text-anchor="middle" class="small rtl">microbatchها یک update</text>

  <circle cx="410" cy="240" r="20" fill="#f0eafb"/><text x="410" y="247" text-anchor="middle" class="badge">۴</text>
  <text x="305" y="292" text-anchor="middle" class="stage rtl">optimizer update</text>
  <text x="305" y="330" text-anchor="middle" class="body rtl">LR از شمارهٔ update</text>
  <text x="305" y="360" text-anchor="middle" class="small rtl">step → schedule → weight</text>

  <path d="M1235 296H1188" stroke="#52738e" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M875 296H828" stroke="#52738e" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M515 296H468" stroke="#52738e" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="80" y="425" width="1440" height="255" rx="26" fill="#fff" stroke="#c4d5df" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="467" text-anchor="middle" class="paneltitle rtl">schedule نمونه — برحسب optimizer update، نه epoch</text>
  <path d="M245 625H1370" stroke="#6d879b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M245 625V505" stroke="#6d879b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="210" y="520" text-anchor="middle" class="math">η</text>
  <text x="1380" y="654" text-anchor="middle" class="small">update</text>
  <path d="M270 610 L470 520 C620 515 730 533 850 552 C1030 580 1190 604 1350 614" fill="none" stroke="#248674" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M470 520V625" stroke="#d6a349" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="470" y="501" text-anchor="middle" class="small rtl">LR peak</text>
  <text x="365" y="653" text-anchor="middle" class="small rtl">warmup خطی</text>
  <text x="930" y="653" text-anchor="middle" class="small rtl">cosine decay → LR کمینه</text>
  <text x="268" y="594" text-anchor="middle" class="small">۰</text>
  <text x="1350" y="594" text-anchor="middle" class="small">U</text>
  <text x="800" y="670" text-anchor="middle" class="small rtl" fill="#5a7184">شکل شماتیک است؛ مقدار peak، warmup و budget با آزمایش همان مدل تعیین می‌شوند.</text>

  <rect x="80" y="720" width="1440" height="202" rx="26" fill="#fff" stroke="#c4d5df" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="759" text-anchor="middle" class="paneltitle rtl">در مرز update: checkpointی بساز که واقعاً بتوان از آن ادامه داد</text>
  <rect x="1110" y="790" width="340" height="78" rx="18" fill="#eaf2fb" stroke="#789bbd" stroke-width="2"/>
  <text x="1280" y="820" text-anchor="middle" class="body rtl">model + optimizer + step/LR</text>
  <text x="1280" y="849" text-anchor="middle" class="small rtl">sampler + RNG + config + hash</text>
  <path d="M1098 829H1017" stroke="#52738e" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="660" y="790" width="340" height="78" rx="18" fill="#fff3df" stroke="#d2a55e" stroke-width="2"/>
  <text x="830" y="820" text-anchor="middle" class="body rtl">temp write → replace اتمی</text>
  <text x="830" y="849" text-anchor="middle" class="small rtl">فایل نیمه‌نوشته را نخوان</text>
  <path d="M648 829H567" stroke="#348b78" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <rect x="150" y="790" width="400" height="78" rx="18" fill="#e7f5ef" stroke="#67a394" stroke-width="2"/>
  <text x="350" y="820" text-anchor="middle" class="body rtl">resume از همان update بعدی</text>
  <text x="350" y="849" text-anchor="middle" class="small rtl">داده و config باید همان باشند</text>
  <text x="800" y="900" text-anchor="middle" class="small rtl" fill="#536d82">Validation برای پایش؛ test فقط پس از پایان run یک‌بار — نه برای تنظیم schedule.</text>
</svg>
