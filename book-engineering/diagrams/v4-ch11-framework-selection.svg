<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc" direction="rtl">
  <title id="title">از مسئلهٔ مشترک تا انتخاب چارچوب یادگیری عمیق</title>
  <desc id="desc">ابتدا workload و محیط را مشخص می‌کنیم، سپس سبک PyTorch، JAX یا TensorFlow را با همان مسئله روی CPU کنترل می‌کنیم، ماتریس سازگاری سخت‌افزار را می‌خوانیم و فقط بعد از آزمون روی workload واقعی تصمیم می‌گیریم. شکل benchmark یا تضمین سرعت نیست.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9ff"/>
      <stop offset="1" stop-color="#edf8f5"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#52718a"/>
    </marker>
    <style>
      text{font-family:Vazirmatn,"Noto Sans Arabic",Tahoma,sans-serif;fill:#18314b}
      .h{font-size:40px;font-weight:700}
      .lead{font-size:23px;fill:#38516b}
      .step{font-size:24px;font-weight:700}
      .body{font-size:20px}
      .cardh{font-size:29px;font-weight:700}
      .small{font-size:18px;fill:#39566c}
      .tag{font-size:19px;font-weight:700}
    </style>
  </defs>
  <rect width="1600" height="1000" rx="28" fill="url(#bg)"/>
  <text class="h" x="800" y="72" text-anchor="middle">یک مسئلهٔ مشترک، سه سبک اجرایی</text>
  <text class="lead" x="800" y="112" text-anchor="middle">ابتدا قرارداد مسئله و محیط؛ بعد چارچوب؛ در پایان، آزمون روی بار واقعی</text>

  <g fill="#fff" stroke="#c8d9e5" stroke-width="2">
    <rect x="1220" y="160" width="260" height="125" rx="20"/>
    <rect x="870" y="160" width="260" height="125" rx="20"/>
    <rect x="520" y="160" width="260" height="125" rx="20"/>
    <rect x="170" y="160" width="260" height="125" rx="20"/>
  </g>
  <g text-anchor="middle">
    <text class="step" x="1350" y="207">۱. workload</text>
    <text class="body" x="1350" y="245">مدل، داده، معیار، محدودیت</text>
    <text class="step" x="1000" y="207">۲. قرارداد محیط</text>
    <text class="body" x="1000" y="245">Python، سیستم‌عامل، بسته‌ها</text>
    <text class="step" x="650" y="207">۳. smoke test</text>
    <text class="body" x="650" y="245">یک ورودی و گرادیان یکسان</text>
    <text class="step" x="300" y="207">۴. تصمیم آزموده</text>
    <text class="body" x="300" y="245">نه بر پایهٔ شعار یا نسخه</text>
  </g>
  <g fill="none" stroke="#52718a" stroke-width="4" marker-end="url(#arrow)">
    <path d="M1210 222 H1147"/>
    <path d="M860 222 H797"/>
    <path d="M510 222 H447"/>
  </g>

  <g stroke-width="2">
    <rect x="1090" y="355" width="360" height="275" rx="24" fill="#f2f7ff" stroke="#8ba9cf"/>
    <rect x="620" y="355" width="360" height="275" rx="24" fill="#f3fbf8" stroke="#81b8a5"/>
    <rect x="150" y="355" width="360" height="275" rx="24" fill="#fff8ee" stroke="#dfb77a"/>
  </g>
  <g text-anchor="middle">
    <text class="cardh" x="1270" y="408">PyTorch</text>
    <text class="tag" x="1270" y="452">eager • autograd</text>
    <text class="body" x="1270" y="501">Pythonی و مستقیم</text>
    <text class="small" x="1270" y="540">torch.compile اختیاری؛</text>
    <text class="small" x="1270" y="570">هزینهٔ compile را جدا بسنجید</text>

    <text class="cardh" x="800" y="408">JAX</text>
    <text class="tag" x="800" y="452">تابع خالص • transforms</text>
    <text class="body" x="800" y="501">grad • jit • vmap</text>
    <text class="small" x="800" y="540">tracing و کلید تصادفی صریح؛</text>
    <text class="small" x="800" y="570">قیدها را آگاهانه طراحی کنید</text>

    <text class="cardh" x="330" y="408">TensorFlow</text>
    <text class="tag" x="330" y="452">eager • tf.function • Keras</text>
    <text class="body" x="330" y="501">API سطح‌بالا و گراف</text>
    <text class="small" x="330" y="540">مسیر export/استقرار را</text>
    <text class="small" x="330" y="570">با نیاز محصول تطبیق دهید</text>
  </g>

  <rect x="190" y="690" width="1220" height="115" rx="22" fill="#173853"/>
  <text x="800" y="735" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">گیت سازگاری قبل از نصب شتاب‌دهنده</text>
  <text x="800" y="775" text-anchor="middle" font-size="20" fill="#e8f4ff">نسخهٔ Python × سیستم‌عامل × معماری × wheel × driver/runtime × device</text>
  <path d="M300 630 V665 H800 V680" fill="none" stroke="#52718a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M800 630 V680" fill="none" stroke="#52718a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1270 630 V665 H800" fill="none" stroke="#52718a" stroke-width="4"/>

  <rect x="300" y="855" width="1000" height="82" rx="20" fill="#fff" stroke="#cadbd7" stroke-width="2"/>
  <text class="step" x="800" y="890" text-anchor="middle">آزمون نهایی روی همان workload و سخت‌افزار</text>
  <text class="small" x="800" y="920" text-anchor="middle">دقت و خروجی پذیرفته‌شده، زمان، حافظه و هزینهٔ اجرا؛ این شکل هیچ‌کدام را اندازه‌گیری نمی‌کند.</text>
  <path d="M800 807 V842" fill="none" stroke="#52718a" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
