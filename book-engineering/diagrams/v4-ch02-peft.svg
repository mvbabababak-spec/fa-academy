<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">چهار مسیر تطبیق پارامتری مدل</title>
  <desc id="desc">مقایسهٔ مفهومی full fine-tuning، adapter bottleneck، LoRA و QLoRA. در full fine-tuning وزن‌های پایه تغییر می‌کنند؛ در دو روش میانی وزن پایه ثابت و ماژول یا عوامل افزوده trainable هستند؛ در QLoRA پایه به‌صورت quantized ذخیره می‌شود و محاسبه با dtype جدا انجام می‌شود. نمودار مقدار حافظه یا کیفیت را اندازه نمی‌گیرد.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#334155"/>
    </marker>
    <pattern id="frozen" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#e2e8f0"/>
      <path d="M0 16L16 0" stroke="#cbd5e1" stroke-width="2"/>
    </pattern>
    <pattern id="quant" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#dbeafe"/>
      <path d="M0 0H20M0 10H20" stroke="#60a5fa" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="#f8fafc"/>
  <text x="800" y="74" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="700" fill="#0f172a" direction="rtl">چهار مسیر تطبیق یک مدل پایه</text>
  <text x="800" y="122" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#475569" direction="rtl">رنگ فقط نوع پارامتر را نشان می‌دهد؛ نه مصرف واقعی حافظه یا برتری کیفیت</text>

  <g font-family="sans-serif" text-anchor="middle">
    <rect x="60" y="170" width="350" height="650" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="235" y="220" font-size="29" font-weight="700" fill="#0f172a" direction="rtl">Full fine-tuning</text>
    <text x="235" y="260" font-size="19" fill="#475569" direction="rtl">تمام وزن‌های مدل تغییرپذیرند</text>
    <rect x="150" y="330" width="170" height="210" rx="12" fill="#fecaca" stroke="#b91c1c" stroke-width="4"/>
    <path d="M150 382H320M150 434H320M150 486H320M206 330V540M263 330V540" stroke="#b91c1c" stroke-width="2" opacity="0.65"/>
    <text x="235" y="445" font-size="23" font-weight="700" fill="#7f1d1d">W</text>
    <text x="235" y="600" font-size="19" fill="#334155" direction="rtl">وزن پایه: trainable</text>
    <text x="235" y="640" font-size="18" fill="#64748b" direction="rtl">optimizer و gradient برای</text>
    <text x="235" y="672" font-size="18" fill="#64748b" direction="rtl">پارامترهای کامل محاسبه می‌شوند</text>
    <text x="235" y="750" font-size="16" fill="#7f1d1d" direction="rtl">قرارداد مقایسهٔ پایه</text>

    <rect x="440" y="170" width="350" height="650" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="615" y="220" font-size="29" font-weight="700" fill="#0f172a" direction="rtl">Adapter bottleneck</text>
    <text x="615" y="260" font-size="19" fill="#475569" direction="rtl">ماژول افزوده روی نمایش میانی</text>
    <rect x="520" y="320" width="190" height="88" rx="12" fill="url(#frozen)" stroke="#64748b" stroke-width="3"/>
    <text x="615" y="374" font-size="23" font-weight="700" fill="#334155">W₀ frozen</text>
    <path d="M615 410V450" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="550" y="470" width="130" height="62" rx="12" fill="#fde68a" stroke="#a16207" stroke-width="3"/>
    <text x="615" y="510" font-size="19" font-weight="700" fill="#713f12" direction="rtl">down → act</text>
    <path d="M615 536V572" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="550" y="590" width="130" height="62" rx="12" fill="#fde68a" stroke="#a16207" stroke-width="3"/>
    <text x="615" y="630" font-size="19" font-weight="700" fill="#713f12" direction="rtl">up + residual</text>
    <text x="615" y="704" font-size="18" fill="#475569" direction="rtl">وزن پایه ثابت؛ adapterها trainable</text>
    <text x="615" y="748" font-size="16" fill="#64748b" direction="rtl">nonlinear، عموماً عملیات اضافه</text>

    <rect x="820" y="170" width="350" height="650" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="995" y="220" font-size="29" font-weight="700" fill="#0f172a" direction="rtl">LoRA</text>
    <text x="995" y="260" font-size="19" fill="#475569" direction="rtl">وزن پایه + update کم‌رتبه</text>
    <rect x="870" y="324" width="154" height="92" rx="12" fill="url(#frozen)" stroke="#64748b" stroke-width="3"/>
    <text x="947" y="380" font-size="21" font-weight="700" fill="#334155">W₀ frozen</text>
    <text x="1080" y="380" font-size="25" font-weight="700" fill="#334155">+</text>
    <rect x="1042" y="310" width="88" height="52" rx="10" fill="#ddd6fe" stroke="#6d28d9" stroke-width="3"/>
    <text x="1086" y="345" font-size="20" font-weight="700" fill="#4c1d95">A</text>
    <path d="M1086 365V387" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1042" y="397" width="88" height="52" rx="10" fill="#ddd6fe" stroke="#6d28d9" stroke-width="3"/>
    <text x="1086" y="432" font-size="20" font-weight="700" fill="#4c1d95">B</text>
    <text x="995" y="505" font-size="22" font-weight="700" fill="#4c1d95">ΔW = γBA</text>
    <text x="995" y="565" font-size="18" fill="#475569" direction="rtl">W₀ frozen؛ عوامل A/B trainable</text>
    <text x="995" y="610" font-size="18" fill="#475569" direction="rtl">r(dᵢₙ + dₒᵤₜ) پارامتر برای</text>
    <text x="995" y="655" font-size="18" fill="#64748b" direction="rtl">یک ماتریس خطی</text>
    <text x="995" y="748" font-size="16" fill="#64748b" direction="rtl">merge فقط با سازگاری و آزمون</text>

    <rect x="1200" y="170" width="350" height="650" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="1375" y="220" font-size="29" font-weight="700" fill="#0f172a" direction="rtl">QLoRA</text>
    <text x="1375" y="260" font-size="19" fill="#475569" direction="rtl">پایهٔ quantized + LoRA</text>
    <rect x="1250" y="324" width="154" height="92" rx="12" fill="url(#quant)" stroke="#1d4ed8" stroke-width="3"/>
    <text x="1327" y="380" font-size="20" font-weight="700" fill="#1e3a8a">Q₄(W₀)</text>
    <text x="1458" y="380" font-size="25" font-weight="700" fill="#334155">+</text>
    <rect x="1420" y="310" width="88" height="52" rx="10" fill="#ddd6fe" stroke="#6d28d9" stroke-width="3"/>
    <text x="1464" y="345" font-size="20" font-weight="700" fill="#4c1d95">A</text>
    <path d="M1464 365V387" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1420" y="397" width="88" height="52" rx="10" fill="#ddd6fe" stroke="#6d28d9" stroke-width="3"/>
    <text x="1464" y="432" font-size="20" font-weight="700" fill="#4c1d95">B</text>
    <text x="1375" y="505" font-size="20" font-weight="700" fill="#1e3a8a" direction="rtl">ذخیرهٔ کم‌دقت</text>
    <text x="1375" y="557" font-size="18" fill="#475569" direction="rtl">محاسبه dtype جداگانه</text>
    <text x="1375" y="603" font-size="18" fill="#475569" direction="rtl">پایه frozen؛ LoRA trainable</text>
    <text x="1375" y="748" font-size="16" fill="#64748b" direction="rtl">کران payload ≠ VRAM کل</text>
  </g>

  <rect x="250" y="860" width="38" height="28" rx="4" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
  <text x="303" y="882" font-family="sans-serif" font-size="18" fill="#334155" direction="rtl">پارامترهای پایهٔ trainable</text>
  <rect x="660" y="860" width="38" height="28" rx="4" fill="url(#frozen)" stroke="#64748b" stroke-width="2"/>
  <text x="713" y="882" font-family="sans-serif" font-size="18" fill="#334155" direction="rtl">پایهٔ frozen</text>
  <rect x="935" y="860" width="38" height="28" rx="4" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="988" y="882" font-family="sans-serif" font-size="18" fill="#334155" direction="rtl">پارامترهای adapter trainable</text>
  <rect x="1330" y="860" width="38" height="28" rx="4" fill="url(#quant)" stroke="#1d4ed8" stroke-width="2"/>
  <text x="1383" y="882" font-family="sans-serif" font-size="18" fill="#334155" direction="rtl">پایهٔ quantized</text>
  <text x="800" y="956" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#64748b" direction="rtl">شمای مفهومی؛ ابعاد و رنگ‌ها اندازه‌گیری یا نتیجهٔ benchmark نیستند.</text>
</svg>
