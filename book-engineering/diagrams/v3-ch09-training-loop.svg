<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc" xml:lang="fa">
  <title id="title">خط لولهٔ آموزش، ارزیابی و تولید مدل زبانی کوچک</title>
  <desc id="desc">سه split مستقل train، validation و test؛ مسیر train از context/target به embedding، MLP، logits، cross-entropy و optimizer می‌رود و فقط train وزن‌ها را به‌روز می‌کند. Validation هر epoch و test پس از تثبیت تنظیمات بدون گرادیان سنجیده می‌شوند. تولید با انتخاب توکن خودبازگشتی است؛ معماری Transformer نیست.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#274c77"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6a9f"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2413b"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a5b08"/>
    </marker>
    <style>
      .fa { font-family: Vazirmatn, "Noto Sans Arabic", Tahoma, "DejaVu Sans", sans-serif; direction: rtl; unicode-bidi: plaintext; fill: #16233a; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #45556d; }
      .head { font-size: 23px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 15px; fill: #4c5d74; }
      .latin { font-family: Inter, Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #21324b; }
      .box { stroke-width: 2.5; rx: 18; }
      .arrow { fill: none; stroke: #274c77; stroke-width: 4; marker-end: url(#arrow); }
      .eval { fill: none; stroke: #2d6a9f; stroke-width: 3.5; stroke-dasharray: 10 9; marker-end: url(#arrow-blue); }
      .test { fill: none; stroke: #9a5b08; stroke-width: 3.5; stroke-dasharray: 3 9; stroke-linecap: round; marker-end: url(#arrow-amber); }
    </style>
  </defs>
  <rect width="1600" height="1000" rx="28" fill="#f6f8fb"/>
  <text class="fa title" x="800" y="54" text-anchor="middle">از splitهای جدا تا پیش‌بینی توکن بعدی</text>
  <text class="fa subtitle" x="800" y="88" text-anchor="middle">Baseline آموزشیِ feed-forward با زمینهٔ ثابت؛ بدون Transformer و self-attention</text>

  <!-- Independent partitions -->
  <rect class="box" x="45" y="120" width="475" height="118" fill="#eaf5ef" stroke="#33745b"/>
  <text class="latin" x="282" y="154" text-anchor="middle">TRAIN</text>
  <text class="fa head" x="282" y="188" text-anchor="middle">آموزش وزن‌ها</text>
  <text class="fa small" x="282" y="217" text-anchor="middle">۱۲ جمله · ۶ گروه مستقل</text>

  <rect class="box" x="562" y="120" width="475" height="118" fill="#eaf2fa" stroke="#2d6a9f"/>
  <text class="latin" x="800" y="154" text-anchor="middle">VALIDATION</text>
  <text class="fa head" x="800" y="188" text-anchor="middle">پایش و انتخاب</text>
  <text class="fa small" x="800" y="217" text-anchor="middle">۲ جمله · ۱ گروه مستقل</text>

  <rect class="box" x="1080" y="120" width="475" height="118" fill="#fff4df" stroke="#9a5b08"/>
  <text class="latin" x="1317" y="154" text-anchor="middle">TEST</text>
  <text class="fa head" x="1317" y="188" text-anchor="middle">گزارش نهایی</text>
  <text class="fa small" x="1317" y="217" text-anchor="middle">۲ جمله · ۱ گروه مستقل</text>
  <text class="fa small" x="800" y="270" text-anchor="middle">split گروهیِ فصل ۴۰؛ اعداد فقط مشخصات پیکرهٔ آموزشیِ ۱۶جمله‌ای‌اند</text>

  <!-- Train-only forward and optimization -->
  <path class="arrow" d="M 282 238 L 282 276 L 145 276 L 145 322"/>
  <text class="fa small" x="216" y="300" text-anchor="middle">فقط train</text>
  <rect class="box" x="40" y="330" width="210" height="150" fill="#ffffff" stroke="#7b8ca6"/>
  <text class="fa head" x="145" y="367" text-anchor="middle">زمینه → هدف</text>
  <text class="fa body" x="145" y="403" text-anchor="middle">BOS، توکن‌ها، EOS</text>
  <text class="fa small" x="145" y="437" text-anchor="middle">context ثابت؛ PAD در چپ</text>
  <text class="fa small" x="145" y="462" text-anchor="middle">هر رکورد جدا می‌ماند</text>

  <rect x="275" y="304" width="750" height="190" rx="24" fill="#edf2f8" stroke="#bdc9d8" stroke-width="2"/>
  <text class="fa small" x="650" y="327" text-anchor="middle">مدل forward: embedding توکن و موقعیت، سپس MLP</text>
  <rect class="box" x="290" y="342" width="220" height="112" fill="#ffffff" stroke="#547a9e"/>
  <text class="fa head" x="400" y="381" text-anchor="middle">Embedding</text>
  <text class="fa body" x="400" y="416" text-anchor="middle">توکن + موقعیت</text>

  <rect class="box" x="555" y="342" width="190" height="112" fill="#ffffff" stroke="#547a9e"/>
  <text class="fa head" x="650" y="381" text-anchor="middle">MLP</text>
  <text class="fa body" x="650" y="416" text-anchor="middle">context = 4</text>

  <rect class="box" x="790" y="342" width="210" height="112" fill="#ffffff" stroke="#547a9e"/>
  <text class="fa head" x="895" y="381" text-anchor="middle">Logits</text>
  <text class="fa body" x="895" y="416" text-anchor="middle">امتیاز هر واژه</text>

  <rect class="box" x="1045" y="330" width="225" height="150" fill="#f9ecea" stroke="#c2413b"/>
  <text class="fa head" x="1157" y="367" text-anchor="middle">Cross-entropy</text>
  <text class="fa body" x="1157" y="403" text-anchor="middle">logits خام + هدف</text>
  <text class="fa small" x="1157" y="437" text-anchor="middle">میانگین NLL روی tokenها</text>
  <text class="fa small" x="1157" y="462" text-anchor="middle">softmax جداگانه لازم نیست</text>

  <rect class="box" x="1310" y="330" width="250" height="150" fill="#f9ecea" stroke="#c2413b"/>
  <text class="latin" x="1435" y="368" text-anchor="middle">OPTIMIZER</text>
  <text class="fa head" x="1435" y="403" text-anchor="middle">AdamW</text>
  <text class="fa small" x="1435" y="437" text-anchor="middle">backward · clipping · step</text>
  <text class="fa small" x="1435" y="462" text-anchor="middle">به‌روزرسانی فقط با train</text>

  <path class="arrow" d="M 250 405 L 282 405"/>
  <path class="arrow" d="M 510 398 L 547 398"/>
  <path class="arrow" d="M 745 398 L 782 398"/>
  <path class="arrow" d="M 1000 398 L 1037 398"/>
  <path class="arrow" d="M 1270 405 L 1302 405"/>
  <text class="fa small" x="800" y="526" text-anchor="middle">ارزیابی با وزن‌های فعلی؛ مسیر inference و بدون گرادیان</text>
  <path class="eval" d="M 895 454 L 895 542 L 800 542 L 800 548"/>
  <path class="test" d="M 895 454 L 895 542 L 1317 542 L 1317 548"/>

  <!-- Separate no-gradient evaluation lanes -->
  <rect class="box" x="562" y="556" width="475" height="120" fill="#f0f6fc" stroke="#2d6a9f" stroke-dasharray="10 8"/>
  <text class="latin" x="800" y="589" text-anchor="middle">VALIDATION</text>
  <text class="fa body" x="800" y="622" text-anchor="middle">NLL در پایان هر epoch</text>
  <text class="fa small" x="800" y="651" text-anchor="middle">برای پایش/انتخاب؛ optimizer اجرا نمی‌شود</text>

  <rect class="box" x="1080" y="556" width="475" height="120" fill="#fff8eb" stroke="#9a5b08" stroke-dasharray="3 8"/>
  <text class="latin" x="1317" y="589" text-anchor="middle">TEST</text>
  <text class="fa body" x="1317" y="622" text-anchor="middle">پس از قفل config، فقط یک ارزیابی</text>
  <text class="fa small" x="1317" y="651" text-anchor="middle">holdout کوچک؛ نه مبنای انتخاب</text>

  <!-- Autoregressive inference lane -->
  <text class="fa head" x="800" y="735" text-anchor="middle">تولید خودبازگشتی با وزن‌های آموزش‌دیده</text>
  <rect class="box" x="48" y="765" width="280" height="105" fill="#ffffff" stroke="#547a9e"/>
  <text class="fa head" x="188" y="805" text-anchor="middle">Prompt</text>
  <text class="fa small" x="188" y="839" text-anchor="middle">توکن‌های آغازین</text>

  <rect class="box" x="382" y="765" width="300" height="105" fill="#edf2f8" stroke="#547a9e"/>
  <text class="fa head" x="532" y="805" text-anchor="middle">مدل → logits</text>
  <text class="fa small" x="532" y="839" text-anchor="middle">آخرین ۴ توکن</text>

  <rect class="box" x="736" y="765" width="300" height="105" fill="#ffffff" stroke="#547a9e"/>
  <text class="fa head" x="886" y="805" text-anchor="middle">انتخاب توکن</text>
  <text class="fa small" x="886" y="839" text-anchor="middle">greedy یا sampling</text>

  <rect class="box" x="1090" y="765" width="240" height="105" fill="#ffffff" stroke="#547a9e"/>
  <text class="fa head" x="1210" y="805" text-anchor="middle">افزودن به زمینه</text>
  <text class="fa small" x="1210" y="839" text-anchor="middle">و پیش‌بینی دوباره</text>

  <rect class="box" x="1380" y="765" width="175" height="105" fill="#eaf5ef" stroke="#33745b"/>
  <text class="fa head" x="1467" y="805" text-anchor="middle">توقف</text>
  <text class="fa small" x="1467" y="839" text-anchor="middle">EOS / سقف</text>

  <path class="arrow" d="M 328 817 L 374 817"/>
  <path class="arrow" d="M 682 817 L 728 817"/>
  <path class="arrow" d="M 1036 817 L 1082 817"/>
  <path class="arrow" d="M 1330 817 L 1372 817"/>
  <path class="arrow" d="M 1210 874 C 1210 954 532 954 532 878"/>
  <text class="fa small" x="870" y="920" text-anchor="middle">تا EOS یا رسیدن به سقف توکن، حلقه تکرار می‌شود</text>
</svg>
