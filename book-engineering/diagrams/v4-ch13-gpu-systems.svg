<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">لایه‌های پشتهٔ GPU و محورهای موازی‌سازی</title>
  <desc id="fig-desc">سمت چپ، مسیر PyTorch از build نرم‌افزاری به دو شاخهٔ CUDA و NCCL برای NVIDIA یا ROCm و HIP و RCCL برای AMD، سپس driver و GPU را نشان می‌دهد؛ Triton مسیر جداگانهٔ ساخت kernel سفارشی برای backend انتخاب‌شده است. سمت راست، DP را تقسیم دستهٔ ورودی، TP را تقسیم لایه، PP را تقسیم عمق، CP را تقسیم توالی و EP را تقسیم expertهای MoE نمایش می‌دهد. رابطهٔ world size فقط برای layout سادهٔ dense است؛ شکل سخت‌افزار یا benchmark واقعی را نشان نمی‌دهد.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071523"/>
      <stop offset="1" stop-color="#101c34"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12283d"/>
      <stop offset="1" stop-color="#0c1a2c"/>
    </linearGradient>
    <marker id="arrow-cyan" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M1,1 L10,6 L1,11 Z" fill="#55d9e8"/>
    </marker>
    <marker id="arrow-violet" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M1,1 L10,6 L1,11 Z" fill="#b89cff"/>
    </marker>
    <style>
      .fa { font-family: sans-serif; font-size: 27px; fill: #eef6ff; text-anchor: middle; }
      .en { font-family: sans-serif; font-size: 22px; fill: #a9c4dd; text-anchor: middle; }
      .small { font-family: sans-serif; font-size: 19px; fill: #b5cadc; text-anchor: middle; }
      .head { font-family: sans-serif; font-size: 34px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .panelhead { font-family: sans-serif; font-size: 29px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .line { fill: none; stroke: #55d9e8; stroke-width: 5; marker-end: url(#arrow-cyan); }
      .dashed { fill: none; stroke: #b89cff; stroke-width: 4; stroke-dasharray: 12 10; marker-end: url(#arrow-violet); }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="800" y="58" class="head">از ساخت تا کارِ توزیع‌شده</text>
  <text x="800" y="96" class="en">GPU software stack and scaling axes</text>

  <rect x="45" y="128" width="735" height="820" rx="28" fill="url(#panel)" stroke="#29435b" stroke-width="2"/>
  <rect x="820" y="128" width="735" height="820" rx="28" fill="url(#panel)" stroke="#29435b" stroke-width="2"/>
  <text x="412" y="174" class="panelhead">لایه‌های نرم‌افزار و دستگاه</text>
  <text x="412" y="208" class="en">Framework → runtime / driver → GPU</text>
  <text x="1187" y="174" class="panelhead">محورهای موازی‌سازی</text>
  <text x="1187" y="208" class="en">Split the dimension that is limiting you</text>

  <rect x="178" y="234" width="470" height="88" rx="18" fill="#183d59" stroke="#55d9e8" stroke-width="3"/>
  <text x="413" y="270" class="fa">کد مدل و چارچوب</text>
  <text x="413" y="301" class="en">PyTorch build</text>
  <path d="M330 323 L230 365" class="line"/>
  <path d="M496 323 L596 365" class="line"/>

  <rect x="75" y="376" width="300" height="122" rx="18" fill="#193852" stroke="#51d3e8" stroke-width="3"/>
  <text x="225" y="414" class="fa">پشتهٔ انویدیا</text>
  <text x="225" y="447" class="en">CUDA + NCCL</text>
  <text x="225" y="477" class="small">نسخهٔ ساخت و درایور را بسنجید</text>

  <rect x="450" y="376" width="300" height="122" rx="18" fill="#24334c" stroke="#b89cff" stroke-width="3"/>
  <text x="600" y="414" class="fa">پشتهٔ ای‌ام‌دی</text>
  <text x="600" y="447" class="en">ROCm / HIP + RCCL</text>
  <text x="600" y="477" class="small">جدول سازگاری دستگاه را بررسی کنید</text>
  <path d="M225 499 L225 550" class="line"/>
  <path d="M600 499 L600 550" class="line"/>

  <rect x="75" y="559" width="300" height="102" rx="18" fill="#172f47" stroke="#3d829a" stroke-width="2"/>
  <text x="225" y="599" class="fa">درایور و زمان‌اجرا</text>
  <text x="225" y="632" class="en">NVIDIA driver / CUDA</text>
  <rect x="450" y="559" width="300" height="102" rx="18" fill="#202d45" stroke="#7e6da7" stroke-width="2"/>
  <text x="600" y="599" class="fa">درایور و زمان‌اجرا</text>
  <text x="600" y="632" class="en">AMD driver / ROCm</text>
  <path d="M225 662 L225 712" class="line"/>
  <path d="M600 662 L600 712" class="line"/>

  <rect x="75" y="721" width="300" height="85" rx="18" fill="#17283c" stroke="#3d829a" stroke-width="2"/>
  <text x="225" y="757" class="fa">شتاب‌دهنده</text>
  <text x="225" y="787" class="en">NVIDIA GPU</text>
  <rect x="450" y="721" width="300" height="85" rx="18" fill="#20283b" stroke="#7e6da7" stroke-width="2"/>
  <text x="600" y="757" class="fa">شتاب‌دهنده</text>
  <text x="600" y="787" class="en">AMD GPU</text>

  <rect x="102" y="838" width="630" height="75" rx="17" fill="#251f3f" stroke="#b89cff" stroke-width="3"/>
  <text x="417" y="870" class="fa">زبان و کامپایلر برای کرنل سفارشی</text>
  <text x="417" y="899" class="en">Triton · select, compile and test each backend</text>
  <path d="M244 837 C180 800 115 740 148 500" class="dashed"/>
  <path d="M590 837 C657 802 719 740 678 500" class="dashed"/>

  <rect x="862" y="238" width="310" height="132" rx="20" fill="#183d59" stroke="#55d9e8" stroke-width="3"/>
  <text x="1017" y="278" class="fa">تقسیم دستهٔ ورودی</text>
  <text x="1017" y="310" class="en">DP · Data Parallelism</text>
  <text x="1017" y="345" class="small">همتاها؛ تکثیر داده یا تقسیم حالت</text>

  <rect x="1200" y="238" width="310" height="132" rx="20" fill="#20334c" stroke="#8ab5ff" stroke-width="3"/>
  <text x="1355" y="278" class="fa">تقسیم لایه</text>
  <text x="1355" y="310" class="en">TP · Tensor Parallelism</text>
  <text x="1355" y="345" class="small">ارتباط درون‌لایه‌ای را در توپولوژی بسنجید</text>

  <rect x="862" y="399" width="310" height="132" rx="20" fill="#233149" stroke="#b89cff" stroke-width="3"/>
  <text x="1017" y="439" class="fa">تقسیم عمق مدل</text>
  <text x="1017" y="471" class="en">PP · Pipeline Parallelism</text>
  <text x="1017" y="506" class="small">مرحله‌ها و حباب‌های خط لوله</text>

  <rect x="1200" y="399" width="310" height="132" rx="20" fill="#203848" stroke="#68d3b1" stroke-width="3"/>
  <text x="1355" y="439" class="fa">تقسیم توالی</text>
  <text x="1355" y="471" class="en">CP · Context Parallelism</text>
  <text x="1355" y="506" class="small">توالی بلند: هزینهٔ ارتباط را بسنجید</text>

  <rect x="862" y="560" width="648" height="132" rx="20" fill="#382b35" stroke="#f0b573" stroke-width="3"/>
  <text x="1186" y="600" class="fa">تقسیم کارشناس‌های مدل ترکیبی</text>
  <text x="1186" y="633" class="en">EP · Expert Parallelism</text>
  <text x="1186" y="668" class="small">مدل کارشناسی: توزیع توکن و توازن بار</text>

  <rect x="862" y="728" width="648" height="148" rx="20" fill="#142b3b" stroke="#55d9e8" stroke-width="3"/>
  <text x="1186" y="769" class="fa">حاصل‌ضرب فقط برای آرایش سادهٔ چگال</text>
  <text x="1186" y="810" class="en">world_size = DP × TP × PP × CP</text>
  <text x="1186" y="847" class="small">محور کارشناس و شبکهٔ ترکیبی در این محاسبه نیست</text>

  <text x="800" y="977" class="small">نام لایه، عنوان محور و جهت پیکان رابطه را توضیح می‌دهند؛ معنا فقط به رنگ وابسته نیست.</text>
</svg>
