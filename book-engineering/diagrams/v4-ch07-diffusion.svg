<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="diagram-title diagram-desc" lang="fa">
  <title id="diagram-title">از نویز تا تصویر یا ویدئو: مسیر diffusion شرطی</title>
  <desc id="diagram-desc">نمای شماتیک زنجیرهٔ پیش‌رو و معکوس diffusion. prompt از text encoder به cross-attention می‌رسد؛ denoiser در چند گام latent را اصلاح می‌کند و decoder خروجی تصویر یا فریم‌های ویدئو را می‌سازد. در پایین، ارزیابی، provenance، حقوق و ایمنی به‌صورت بررسی‌های جدا نشان داده شده‌اند. این نمودار داده یا مدل واقعی نیست.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-violet" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .fa { font-family: Vazirmatn, "Segoe UI", Tahoma, sans-serif; fill: #14213d; }
      .title { font-size: 38px; font-weight: 700; }
      .head { font-size: 27px; font-weight: 700; }
      .body { font-size: 23px; }
      .small { font-size: 19px; }
      .card { stroke-width: 2.5; rx: 22; }
      .arrow { fill: none; stroke-width: 5; stroke-linecap: round; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f8fafc"/>
  <text id="heading" class="fa title" x="800" y="62" text-anchor="middle" direction="rtl">از نویز تا تصویر و ویدئو</text>
  <text class="fa small" x="800" y="100" text-anchor="middle" direction="rtl">شمای آموزشیِ مسیر شرطی؛ معماری‌های واقعی در جزئیات متفاوت‌اند</text>

  <rect x="42" y="130" width="1516" height="344" rx="28" fill="#ffffff" stroke="#dbe4f0" stroke-width="2"/>
  <text class="fa head" x="1500" y="173" text-anchor="end" direction="rtl">نمونه‌گیری معکوس: شرطِ متنی به denoiser می‌رسد</text>

  <rect class="card" x="70" y="235" width="205" height="126" fill="#eff6ff" stroke="#60a5fa"/>
  <text class="fa head" x="172" y="283" text-anchor="middle" direction="rtl">نویز آغازین</text>
  <text class="fa body" x="172" y="326" text-anchor="middle">zₜ</text>
  <text class="fa small" x="172" y="351" text-anchor="middle" direction="rtl">گام T</text>

  <path class="arrow" d="M282 298 H325" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <rect class="card" x="335" y="225" width="438" height="146" fill="#f5f3ff" stroke="#a78bfa"/>
  <text class="fa head" x="554" y="265" text-anchor="middle" direction="rtl">denoiser: U-Net یا Transformer</text>
  <text class="fa body" x="554" y="308" text-anchor="middle">εθ(zₜ, t, c)</text>
  <rect x="398" y="326" width="312" height="34" rx="15" fill="#ede9fe" stroke="#8b5cf6"/>
  <text class="fa small" x="554" y="351" text-anchor="middle">cross-attention / joint attention</text>

  <path class="arrow" d="M780 298 H822" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <rect class="card" x="832" y="235" width="170" height="126" fill="#ecfeff" stroke="#22a6a1"/>
  <text class="fa head" x="917" y="283" text-anchor="middle" direction="rtl">گام بعد</text>
  <text class="fa body" x="917" y="326" text-anchor="middle">zₜ₋₁</text>
  <text class="fa small" x="917" y="351" text-anchor="middle" direction="rtl">تا z₀</text>
  <path class="arrow" d="M924 226 C924 196 548 190 548 218" stroke="#7c3aed" marker-end="url(#arrow-violet)"/>
  <text class="fa small" x="737" y="205" text-anchor="middle" direction="rtl">تکرار در schedule انتخاب‌شده</text>

  <path class="arrow" d="M1008 298 H1050" stroke="#0f766e" marker-end="url(#arrow-teal)"/>
  <rect class="card" x="1060" y="235" width="188" height="126" fill="#f0fdf4" stroke="#4ade80"/>
  <text class="fa head" x="1154" y="283" text-anchor="middle" direction="rtl">decoder</text>
  <text class="fa body" x="1154" y="324" text-anchor="middle">D(z₀)</text>
  <text class="fa small" x="1154" y="351" text-anchor="middle" direction="rtl">از latent به pixels</text>

  <path class="arrow" d="M1254 298 H1296" stroke="#0f766e" marker-end="url(#arrow-teal)"/>
  <rect class="card" x="1306" y="218" width="222" height="160" fill="#fff7ed" stroke="#fb923c"/>
  <text class="fa head" x="1417" y="260" text-anchor="middle" direction="rtl">خروجی</text>
  <rect x="1342" y="279" width="68" height="58" rx="9" fill="#bfdbfe" stroke="#3b82f6"/>
  <circle cx="1391" cy="293" r="8" fill="#fbbf24"/>
  <path d="M1349 326 L1370 302 L1385 318 L1396 306 L1404 326 Z" fill="#34d399"/>
  <rect x="1424" y="279" width="28" height="58" rx="6" fill="#ddd6fe" stroke="#8b5cf6"/>
  <rect x="1458" y="279" width="28" height="58" rx="6" fill="#c4b5fd" stroke="#8b5cf6"/>
  <rect x="1492" y="279" width="22" height="58" rx="6" fill="#a78bfa" stroke="#8b5cf6"/>
  <text class="fa small" x="1417" y="365" text-anchor="middle" direction="rtl">تصویر یا چند فریم</text>

  <rect class="card" x="380" y="154" width="300" height="54" fill="#fffbeb" stroke="#fbbf24"/>
  <text class="fa small" x="530" y="189" text-anchor="middle" direction="rtl">prompt c → text encoder → توکن‌های K,V</text>
  <path d="M530 210 V220" stroke="#d97706" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <rect x="42" y="502" width="1516" height="188" rx="28" fill="#ffffff" stroke="#dbe4f0" stroke-width="2"/>
  <text class="fa head" x="1500" y="545" text-anchor="end" direction="rtl">آموزش diffusion: از داده به نویز، سپس یادگیری جهتِ بازگشت</text>
  <rect class="card" x="90" y="568" width="330" height="88" fill="#f0fdf4" stroke="#4ade80"/>
  <text class="fa head" x="255" y="605" text-anchor="middle" direction="rtl">دادهٔ آموزشی x₀</text>
  <text class="fa small" x="255" y="636" text-anchor="middle" direction="rtl">تصویر یا latent پاک</text>
  <path class="arrow" d="M430 611 H510" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <rect class="card" x="520" y="568" width="365" height="88" fill="#eff6ff" stroke="#60a5fa"/>
  <text class="fa head" x="702" y="605" text-anchor="middle">q(xₜ | x₀)</text>
  <text class="fa small" x="702" y="636" text-anchor="middle" direction="rtl">schedule نویز و زمان t</text>
  <path class="arrow" d="M895 611 H974" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <rect class="card" x="984" y="568" width="475" height="88" fill="#f5f3ff" stroke="#a78bfa"/>
  <text class="fa head" x="1222" y="605" text-anchor="middle" direction="rtl">هدف آموزشی: تخمین نویز / score / نسخهٔ دیگر</text>
  <text class="fa small" x="1222" y="636" text-anchor="middle" direction="rtl">پارامتردهی‌ها و lossها یکسان نیستند</text>

  <rect x="42" y="718" width="1516" height="202" rx="28" fill="#ffffff" stroke="#dbe4f0" stroke-width="2"/>
  <text class="fa head" x="1500" y="760" text-anchor="end" direction="rtl">ویدئو: فریم‌ها به‌علاوهٔ سازگاری در زمان</text>
  <rect x="100" y="790" width="118" height="83" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="190" cy="808" r="9" fill="#fbbf24"/>
  <path d="M111 861 L147 818 L173 850 L190 833 L207 861 Z" fill="#34d399"/>
  <text class="fa small" x="159" y="899" text-anchor="middle">t₁</text>
  <path class="arrow" d="M229 831 H315" stroke="#7c3aed" marker-end="url(#arrow-violet)"/>
  <rect x="330" y="790" width="118" height="83" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="420" cy="808" r="9" fill="#fbbf24"/>
  <path d="M341 861 L377 818 L403 850 L420 833 L437 861 Z" fill="#34d399"/>
  <text class="fa small" x="389" y="899" text-anchor="middle">t₂</text>
  <path class="arrow" d="M459 831 H545" stroke="#7c3aed" marker-end="url(#arrow-violet)"/>
  <rect x="560" y="790" width="118" height="83" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="650" cy="808" r="9" fill="#fbbf24"/>
  <path d="M571 861 L607 818 L633 850 L650 833 L667 861 Z" fill="#34d399"/>
  <text class="fa small" x="619" y="899" text-anchor="middle">t₃</text>
  <path d="M704 831 H756" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow-violet)"/>
  <text class="fa body" x="805" y="824" text-anchor="middle" direction="rtl">latentهای مکانی–زمانی</text>
  <text class="fa small" x="805" y="858" text-anchor="middle" direction="rtl">هویت، حرکت و ترتیب رخداد</text>
  <rect x="1010" y="786" width="480" height="94" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text class="fa head" x="1250" y="823" text-anchor="middle" direction="rtl">پس از تولید: ارزیابی و بازبینی</text>
  <text class="fa small" x="1250" y="855" text-anchor="middle" direction="rtl">کیفیت ≠ یک امتیاز؛ حقوق، رضایت و ایمنی را جدا بررسی کنید</text>

  <text class="fa small" x="800" y="965" text-anchor="middle" direction="rtl">در همهٔ مسیرها: ثبت مدل و تنظیمات • سنجش متناسب با کاربرد • بررسی provenance؛ امضای منشأ، حقیقتِ محتوا را تضمین نمی‌کند</text>
</svg>
