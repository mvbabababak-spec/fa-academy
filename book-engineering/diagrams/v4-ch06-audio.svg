<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">دو مسیر گفتار از نمونهٔ صوتی تا متن و از متن تا گفتار</title>
  <desc id="desc">در مسیر بالایی، waveform با نرخ نمونه و پنجره‌های هم‌پوشان به ویژگی تبدیل می‌شود و رمزگذار صوتی به رمزگشا یا مدل زبانی گفتار، transcript می‌دهد؛ WER و CER روی متن مرجع جدا ارزیابی می‌شوند. در مسیر پایینی، متن و کنترل گوینده/سبک به مدل گفتار می‌رسند و خروجی به صورت waveform یا توکن‌های codec بازسازی می‌شود؛ طبیعی‌بودن، intelligibility، شباهت گوینده، prosody و latency جداگانه سنجیده می‌شوند. دو مسیر می‌توانند در مدل Audio-Language یا گفت‌وگوی full-duplex به هم متصل شوند. شکل شماتیک است و مدل/آزمون واقعی نیست.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#294653"/>
    </marker>
    <style>
      text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#19313b}
      .title{font-size:38px;font-weight:700}.subtitle{font-size:22px}
      .label{font-size:25px;font-weight:700}.body{font-size:20px}.small{font-size:17px}
      .box{stroke:#294653;stroke-width:3;rx:22}
      .arrow{stroke:#294653;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .thin{stroke:#607983;stroke-width:2}
      .wave{stroke:#497f91;stroke-width:4;fill:none}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f7fafb"/>
  <text x="800" y="66" text-anchor="middle" class="title">از waveform تا transcript؛ از متن تا گفتار</text>
  <text x="800" y="108" text-anchor="middle" class="subtitle">ورودی، نمایش، تولید و سنجه‌ها را با task و قرارداد واقعی هماهنگ کنید</text>

  <text x="70" y="160" class="label">بازشناسی گفتار (ASR)</text>
  <rect x="55" y="180" width="245" height="230" class="box" fill="#e3f1ec"/>
  <text x="177" y="220" text-anchor="middle" class="label">Waveform</text>
  <line x1="88" y1="300" x2="268" y2="300" class="thin"/>
  <path d="M88 300 C102 240 116 360 130 300 S158 240 172 300 S200 360 214 300 S242 240 268 300" class="wave"/>
  <text x="177" y="360" text-anchor="middle" class="body">fₛ، channel، مدت</text>
  <text x="177" y="390" text-anchor="middle" class="small">سینوس شکل، نه گفتار</text>

  <rect x="340" y="180" width="270" height="230" class="box" fill="#fff0c9"/>
  <text x="475" y="220" text-anchor="middle" class="label">Frontend</text>
  <text x="475" y="270" text-anchor="middle" class="body">frame + window</text>
  <text x="475" y="310" text-anchor="middle" class="body">STFT / log-Mel</text>
  <text x="475" y="365" text-anchor="middle" class="small">sample rate را بازنویسی نکنید</text>

  <rect x="650" y="180" width="280" height="230" class="box" fill="#fce3db"/>
  <text x="790" y="220" text-anchor="middle" class="label">Speech encoder</text>
  <rect x="700" y="255" width="180" height="38" rx="9" fill="#fff" stroke="#9c796d" stroke-width="2"/>
  <rect x="700" y="305" width="180" height="38" rx="9" fill="#fff" stroke="#9c796d" stroke-width="2"/>
  <text x="790" y="280" text-anchor="middle" class="small">acoustic evidence</text>
  <text x="790" y="330" text-anchor="middle" class="small">context / time</text>
  <text x="790" y="380" text-anchor="middle" class="small">CTC · transducer · seq2seq</text>

  <rect x="970" y="180" width="275" height="230" class="box" fill="#e7e1f4"/>
  <text x="1107" y="220" text-anchor="middle" class="label">Decoder</text>
  <text x="1107" y="270" text-anchor="middle" class="body">token sequence</text>
  <text x="1107" y="310" text-anchor="middle" class="body">punctuation / timestamp</text>
  <text x="1107" y="365" text-anchor="middle" class="small">language prior may help or bias</text>

  <rect x="1285" y="180" width="260" height="230" class="box" fill="#dff0f2"/>
  <text x="1415" y="220" text-anchor="middle" class="label">Transcript</text>
  <text x="1415" y="270" text-anchor="middle" class="body">reference ↔ hypothesis</text>
  <text x="1415" y="315" text-anchor="middle" class="small">WER / CER / entity errors</text>
  <text x="1415" y="365" text-anchor="middle" class="small">normalization ثبت شود</text>

  <path d="M300 295 H330" class="arrow"/><path d="M610 295 H640" class="arrow"/>
  <path d="M930 295 H960" class="arrow"/><path d="M1245 295 H1275" class="arrow"/>

  <text x="70" y="505" class="label">تولید گفتار (TTS) و گفت‌وگوی صوتی</text>
  <rect x="55" y="535" width="245" height="230" class="box" fill="#e7f0fb"/>
  <text x="177" y="580" text-anchor="middle" class="label">متن + قصد</text>
  <text x="177" y="630" text-anchor="middle" class="body">واژه‌ها / phoneme</text>
  <text x="177" y="675" text-anchor="middle" class="small">گفتار، سبک و context</text>
  <text x="177" y="720" text-anchor="middle" class="small">اجازهٔ صدای مرجع</text>

  <rect x="340" y="535" width="270" height="230" class="box" fill="#fff0c9"/>
  <text x="475" y="580" text-anchor="middle" class="label">Conditioning</text>
  <text x="475" y="630" text-anchor="middle" class="body">speaker / prosody</text>
  <text x="475" y="675" text-anchor="middle" class="small">duration / emotion tags</text>
  <text x="475" y="720" text-anchor="middle" class="small">کنترل ادعا، نه تضمین</text>

  <rect x="650" y="535" width="280" height="230" class="box" fill="#fce3db"/>
  <text x="790" y="580" text-anchor="middle" class="label">Speech generator</text>
  <text x="790" y="630" text-anchor="middle" class="body">acoustic model / codec LM</text>
  <text x="790" y="675" text-anchor="middle" class="small">AR · diffusion · flow</text>
  <text x="790" y="720" text-anchor="middle" class="small">chunk یا full-duplex</text>

  <rect x="970" y="535" width="275" height="230" class="box" fill="#e3f1ec"/>
  <text x="1107" y="580" text-anchor="middle" class="label">Waveform output</text>
  <text x="1107" y="630" text-anchor="middle" class="body">vocoder / codec decoder</text>
  <text x="1107" y="675" text-anchor="middle" class="small">sample rate + channel</text>
  <text x="1107" y="720" text-anchor="middle" class="small">streaming latency</text>

  <rect x="1285" y="535" width="260" height="230" class="box" fill="#dff0f2"/>
  <text x="1415" y="580" text-anchor="middle" class="label">چند بُعد ارزیابی</text>
  <text x="1415" y="625" text-anchor="middle" class="small">intelligibility · naturalness</text>
  <text x="1415" y="662" text-anchor="middle" class="small">speaker · prosody · control</text>
  <text x="1415" y="699" text-anchor="middle" class="small">MOS + objective + latency</text>
  <text x="1415" y="739" text-anchor="middle" class="small">یک score کافی نیست</text>

  <path d="M300 650 H330" class="arrow"/><path d="M610 650 H640" class="arrow"/>
  <path d="M930 650 H960" class="arrow"/><path d="M1245 650 H1275" class="arrow"/>

  <path d="M790 410 V450 H790 V525" class="arrow" stroke-dasharray="10 9"/>
  <text x="800" y="870" text-anchor="middle" class="body">Audio-Language model می‌تواند ورودی و خروجی صوت/متن را در یک سامانه پیوند دهد؛</text>
  <text x="800" y="907" text-anchor="middle" class="small">این شکل قراردادها و سنجه‌ها را نشان می‌دهد، نه مدل، صوت یا benchmark واقعی</text>
</svg>
