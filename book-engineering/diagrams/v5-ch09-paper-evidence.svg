<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc" xml:lang="fa">
  <title id="title">از ادعای مقاله تا گزارش محدود بازتولید</title>
  <desc id="desc">نمودار فارسی جریان ممیزی مقاله را نشان می‌دهد: ادعا به چهار مؤلفهٔ داده و split، روش و کد، محیط و نسخه، و معیار و شاهد شکسته می‌شود؛ این مؤلفه‌ها وارد یک اجرای مستقل با run card و قاعدهٔ پذیرش می‌شوند. چهار خروجی نام‌گذاری‌شده عبارت‌اند از نتیجهٔ سازگار در تلورانس، توقف به‌علت artifact گمشده، ارزیابی‌نشدن دامنهٔ تازه، و ناسازگاری عددی که نیازمند بررسی است. شکل به رنگ وابسته نیست.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#25364a"/>
    </marker>
    <style>
      .box { fill:#fff; stroke:#25364a; stroke-width:2.4; rx:16; }
      .soft { fill:#f2f5f8; stroke:#25364a; stroke-width:2.4; rx:16; }
      .line { fill:none; stroke:#25364a; stroke-width:2.6; marker-end:url(#arrow); }
      .dash { fill:none; stroke:#25364a; stroke-width:2.4; stroke-dasharray:9 7; marker-end:url(#arrow); }
      text { font-family:Tahoma,Arial,sans-serif; fill:#172436; direction:rtl; unicode-bidi:plaintext; text-anchor:middle; }
      .head { font-size:25px; font-weight:700; }
      .body { font-size:20px; }
      .small { font-size:18px; }
    </style>
  </defs>
  <g transform="translate(60,-16) scale(1.08,0.9)">
  <rect class="soft" x="315" y="24" width="450" height="100"/>
  <text class="head" x="540" y="64">مقاله و ادعای آزمون‌پذیر</text>
  <text class="body" x="540" y="99">دامنه، مقایسه‌گر و نتیجهٔ گزارش‌شده</text>

  <path class="line" d="M540 124 L540 158"/>
  <rect class="box" x="42" y="178" width="228" height="118"/>
  <text class="head" x="156" y="222">داده و split</text>
  <text class="body" x="156" y="258">نسخه، منشأ، واحد</text>
  <text class="body" x="156" y="284">و جداسازی</text>

  <rect class="box" x="309" y="178" width="228" height="118"/>
  <text class="head" x="423" y="222">روش و کد</text>
  <text class="body" x="423" y="258">معماری، تنظیم،</text>
  <text class="body" x="423" y="284">baseline و seed</text>

  <rect class="box" x="576" y="178" width="228" height="118"/>
  <text class="head" x="690" y="222">محیط و نسخه</text>
  <text class="body" x="690" y="258">وابستگی، سخت‌افزار،</text>
  <text class="body" x="690" y="284">checkpoint و digest</text>

  <rect class="box" x="843" y="178" width="195" height="118"/>
  <text class="head" x="940" y="222">معیار و شاهد</text>
  <text class="body" x="940" y="258">metric، مخرج،</text>
  <text class="body" x="940" y="284">عدم‌قطعیت</text>

  <path class="line" d="M540 158 C470 158 156 145 156 178"/>
  <path class="line" d="M540 158 L423 178"/>
  <path class="line" d="M540 158 L690 178"/>
  <path class="line" d="M540 158 C620 158 940 145 940 178"/>

  <path class="line" d="M156 296 C156 345 410 335 460 365"/>
  <path class="line" d="M423 296 L500 365"/>
  <path class="line" d="M690 296 L580 365"/>
  <path class="line" d="M940 296 C940 345 670 335 620 365"/>

  <rect class="soft" x="310" y="365" width="460" height="120"/>
  <text class="head" x="540" y="410">اجرای مستقل با run card</text>
  <text class="body" x="540" y="447">فرمان، محیط، hash و قاعدهٔ پذیرشِ ازپیش‌ثبت‌شده</text>
  <text class="small" x="540" y="474">ثبت خروجی، اختلاف و انحراف از پروتکل</text>

  <path class="line" d="M540 485 L540 532"/>
  <rect class="box" x="38" y="554" width="242" height="142"/>
  <text class="head" x="159" y="598">سازگار در تلورانس</text>
  <text class="body" x="159" y="636">فقط برای همان</text>
  <text class="body" x="159" y="664">داده و پروتکل</text>

  <rect class="box" x="300" y="554" width="242" height="142"/>
  <text class="head" x="421" y="598">متوقف: artifact گمشده</text>
  <text class="body" x="421" y="636">شکاف شواهد؛ نه</text>
  <text class="body" x="421" y="664">رد ادعا</text>

  <rect class="box" x="562" y="554" width="242" height="142"/>
  <text class="head" x="683" y="598">دامنهٔ تازه</text>
  <text class="body" x="683" y="636">ارزیابی‌نشده تا</text>
  <text class="body" x="683" y="664">دادهٔ مستقل</text>

  <rect class="box" x="824" y="554" width="218" height="142"/>
  <text class="head" x="933" y="598">ناسازگار</text>
  <text class="body" x="933" y="636">بررسی اختلاف؛</text>
  <text class="body" x="933" y="664">علت را حدس نزنید</text>

  <path class="line" d="M540 532 C490 540 159 520 159 554"/>
  <path class="dash" d="M540 532 L421 554"/>
  <path class="dash" d="M540 532 L683 554"/>
  <path class="line" d="M540 532 C590 540 933 520 933 554"/>
  </g>
</svg>
