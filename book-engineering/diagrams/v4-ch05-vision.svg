<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">مسیر وصله‌های تصویر تا هم‌ترازی متن و تصویر</title>
  <desc id="desc">در ردیف بالایی، تصویر شماتیک از preprocessing شامل resize و normalization به وصله‌های مرتب تبدیل می‌شود؛ Vision Transformer توالی وصله و موقعیت را پردازش می‌کند و نمایش‌های مکانی و سراسری می‌دهد. در ردیف پایین، متن از text encoder به embedding می‌رود؛ embeddingهای متن و تصویر در ماتریس شباهت برای retrieval مقایسه می‌شوند و معیار ارزیابی روی دادهٔ جدا اعمال می‌شود. شکل مدل واقعی یا نتیجهٔ آزمایش نیست.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#294653"/>
    </marker>
    <style>
      text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#19313b}
      .title{font-size:38px;font-weight:700}.subtitle{font-size:22px}
      .label{font-size:25px;font-weight:700}.body{font-size:20px}.small{font-size:17px}
      .box{stroke:#294653;stroke-width:3;rx:22}
      .arrow{stroke:#294653;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .thin{stroke:#607983;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f7fafb"/>
  <text x="800" y="70" text-anchor="middle" class="title">از پیکسل تا فضای مشترک تصویر–متن</text>
  <text x="800" y="110" text-anchor="middle" class="subtitle">وصله، ویژگی و امتیاز retrieval سه مرحله‌اند؛ هیچ‌کدام به‌تنهایی شاهد حقیقت نیست</text>

  <rect x="55" y="165" width="245" height="250" class="box" fill="#e3f1ec"/>
  <text x="177" y="205" text-anchor="middle" class="label">تصویر ورودی</text>
  <rect x="94" y="230" width="165" height="108" rx="8" fill="#d7e2ec" stroke="#526e7b" stroke-width="2"/>
  <path d="M99 318 L139 276 L164 300 L196 263 L254 320 Z" fill="#7ab59e"/>
  <circle cx="220" cy="252" r="12" fill="#f0c56c"/>
  <text x="177" y="365" text-anchor="middle" class="body">RGB، نسبت و منبع</text>
  <text x="177" y="395" text-anchor="middle" class="small">فایل واقعی در این شکل نیست</text>

  <rect x="345" y="165" width="255" height="250" class="box" fill="#fff0c9"/>
  <text x="472" y="205" text-anchor="middle" class="label">پیش‌پردازش</text>
  <text x="472" y="255" text-anchor="middle" class="body">resize / crop</text>
  <text x="472" y="293" text-anchor="middle" class="body">رنگ و normalization</text>
  <text x="472" y="345" text-anchor="middle" class="small">قرارداد ورودی ثبت شود</text>
  <text x="472" y="375" text-anchor="middle" class="small">وضوح، crop و channel</text>

  <rect x="645" y="165" width="280" height="250" class="box" fill="#fce3db"/>
  <text x="785" y="205" text-anchor="middle" class="label">وصله‌های تصویری</text>
  <g stroke="#526e7b" stroke-width="2">
    <rect x="716" y="235" width="34" height="34" fill="#b7d4cd"/><rect x="750" y="235" width="34" height="34" fill="#dce9df"/><rect x="784" y="235" width="34" height="34" fill="#f0d8aa"/><rect x="818" y="235" width="34" height="34" fill="#d1dedc"/>
    <rect x="716" y="269" width="34" height="34" fill="#8ab8a4"/><rect x="750" y="269" width="34" height="34" fill="#c1d8cd"/><rect x="784" y="269" width="34" height="34" fill="#ead7ad"/><rect x="818" y="269" width="34" height="34" fill="#e8e1d0"/>
    <rect x="716" y="303" width="34" height="34" fill="#6fa38c"/><rect x="750" y="303" width="34" height="34" fill="#a8cbb9"/><rect x="784" y="303" width="34" height="34" fill="#dcc999"/><rect x="818" y="303" width="34" height="34" fill="#c9d9d3"/>
  </g>
  <text x="785" y="370" text-anchor="middle" class="small">patch embedding + position</text>

  <rect x="970" y="165" width="270" height="250" class="box" fill="#e7e1f4"/>
  <text x="1105" y="205" text-anchor="middle" class="label">Vision Transformer</text>
  <rect x="1010" y="232" width="190" height="43" rx="10" fill="#fff" stroke="#7b6e9f" stroke-width="2"/>
  <rect x="1010" y="286" width="190" height="43" rx="10" fill="#fff" stroke="#7b6e9f" stroke-width="2"/>
  <rect x="1010" y="340" width="190" height="43" rx="10" fill="#fff" stroke="#7b6e9f" stroke-width="2"/>
  <text x="1105" y="260" text-anchor="middle" class="small">self-attention + MLP</text>
  <text x="1105" y="314" text-anchor="middle" class="small">self-attention + MLP</text>
  <text x="1105" y="368" text-anchor="middle" class="small">self-attention + MLP</text>

  <rect x="1285" y="165" width="260" height="250" class="box" fill="#dff0f2"/>
  <text x="1415" y="205" text-anchor="middle" class="label">خروجی encoder</text>
  <text x="1415" y="252" text-anchor="middle" class="body">patch features</text>
  <text x="1415" y="283" text-anchor="middle" class="small">[B, N, d]</text>
  <line x1="1340" y1="300" x2="1490" y2="300" class="thin"/>
  <text x="1415" y="337" text-anchor="middle" class="body">pooling → projection</text>
  <text x="1415" y="374" text-anchor="middle" class="small">global embedding</text>

  <path d="M300 290 H335" class="arrow"/>
  <path d="M600 290 H635" class="arrow"/>
  <path d="M925 290 H960" class="arrow"/>
  <path d="M1240 290 H1275" class="arrow"/>

  <rect x="70" y="565" width="270" height="210" class="box" fill="#e7f0fb"/>
  <text x="205" y="610" text-anchor="middle" class="label">شرح متنی</text>
  <text x="205" y="655" text-anchor="middle" class="body">عبارت و زبان query</text>
  <text x="205" y="699" text-anchor="middle" class="small">caption همیشه کامل نیست</text>
  <text x="205" y="739" text-anchor="middle" class="small">منشأ و split را ثبت کنید</text>

  <rect x="390" y="565" width="280" height="210" class="box" fill="#fff0c9"/>
  <text x="530" y="610" text-anchor="middle" class="label">Text encoder</text>
  <text x="530" y="659" text-anchor="middle" class="body">pooling + projection</text>
  <text x="530" y="704" text-anchor="middle" class="small">embedding نرمال‌شده</text>
  <text x="530" y="744" text-anchor="middle" class="small">هم‌ترازی یک هدف آموزشی است</text>

  <rect x="760" y="510" width="475" height="315" class="box" fill="#fce3db"/>
  <text x="997" y="552" text-anchor="middle" class="label">ماتریس شباهت تصویر × متن</text>
  <text x="997" y="585" text-anchor="middle" class="small">قطر فقط در batch تک‌مثبتی مثبت فرض می‌شود</text>
  <g transform="translate(910 615)" stroke="#ffffff" stroke-width="4">
    <rect x="0" y="0" width="46" height="42" fill="#4f9a87"/><rect x="46" y="0" width="46" height="42" fill="#d7c7b0"/><rect x="92" y="0" width="46" height="42" fill="#c7d8dc"/><rect x="138" y="0" width="46" height="42" fill="#c7d8dc"/>
    <rect x="0" y="42" width="46" height="42" fill="#c7d8dc"/><rect x="46" y="42" width="46" height="42" fill="#4f9a87"/><rect x="92" y="42" width="46" height="42" fill="#d7c7b0"/><rect x="138" y="42" width="46" height="42" fill="#c7d8dc"/>
    <rect x="0" y="84" width="46" height="42" fill="#c7d8dc"/><rect x="46" y="84" width="46" height="42" fill="#c7d8dc"/><rect x="92" y="84" width="46" height="42" fill="#4f9a87"/><rect x="138" y="84" width="46" height="42" fill="#d7c7b0"/>
    <rect x="0" y="126" width="46" height="42" fill="#c7d8dc"/><rect x="46" y="126" width="46" height="42" fill="#d7c7b0"/><rect x="92" y="126" width="46" height="42" fill="#c7d8dc"/><rect x="138" y="126" width="46" height="42" fill="#4f9a87"/>
  </g>
  <text x="997" y="803" text-anchor="middle" class="small">غیرقطری‌ها ممکن است false negative باشند</text>

  <rect x="1320" y="565" width="235" height="210" class="box" fill="#dff0f2"/>
  <text x="1437" y="610" text-anchor="middle" class="label">ارزیابی جدا</text>
  <text x="1437" y="655" text-anchor="middle" class="body">text ↔ image</text>
  <text x="1437" y="700" text-anchor="middle" class="small">Recall@k / MRR</text>
  <text x="1437" y="740" text-anchor="middle" class="small">gallery ثابت + relevance</text>

  <path d="M340 668 H380" class="arrow"/>
  <path d="M670 668 H750" class="arrow"/>
  <path d="M1235 668 H1310" class="arrow"/>
  <path d="M1415 415 V465 H1190 V500" class="arrow"/>
  <text x="800" y="900" text-anchor="middle" class="small">نمودار آموزشی است: نه forward pass مدل واقعی، نه بنچمارک و نه تضمین درستی</text>
</svg>
