<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1320 760" role="img" aria-labelledby="svgTitle svgDesc" xml:lang="fa">
  <title id="svgTitle">مرز هویت، مجوز، سهمیه و پایش حریم‌خصوصی‌محور</title>
  <desc id="svgDesc">نمودار مفهومیِ جریان درخواست از راست به چپ: کاربر یا سرویس، درگاه API، احراز هویت، محدودیت نرخ، مجوز action و tenant/object، سپس اجرا یا رد. خروجی کمینه به ممیزی ساخت‌یافته و شمارنده‌های کم‌جزئیات می‌رود؛ metric می‌تواند alert بسازد و alert به triage و playbook می‌رسد. prompt، credential و دادهٔ شخصی در مسیر log قرار نمی‌گیرند. برچسب‌ها، کادرها و پیکان‌ها معنا را مستقل از رنگ مشخص می‌کنند.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#26384a"/>
    </marker>
    <style>
      text { font-family: sans-serif; fill: #182434; }
      .heading { font-size: 27px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 700; }
      .small { font-size: 17px; }
      .box { fill: #f7f9fc; stroke: #26384a; stroke-width: 2.5; rx: 14; }
      .telemetry { fill: #eef5f7; stroke: #315a68; stroke-width: 2.5; rx: 14; }
      .incident { fill: #f5f1e8; stroke: #655234; stroke-width: 2.5; rx: 14; }
      .sensitive { fill: #fff7f4; stroke: #9a3a31; stroke-width: 3; stroke-dasharray: 9 7; rx: 14; }
      .flow { fill: none; stroke: #26384a; stroke-width: 3; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #315a68; stroke-width: 2.5; marker-end: url(#arrow); }
      .blocked { fill: none; stroke: #9a3a31; stroke-width: 3; stroke-dasharray: 10 8; }
      .rule { stroke: #8a969f; stroke-width: 1.5; }
    </style>
  </defs>
  <rect x="12" y="12" width="1296" height="736" fill="#ffffff" stroke="#d5dbe1" stroke-width="2" rx="18"/>
  <text x="660" y="58" class="heading" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">کنترل درخواست: هویت، سهمیه، مجوز</text>

  <rect x="1090" y="92" width="190" height="100" class="box"/>
  <text x="1185" y="132" class="label" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">کاربر / سرویس</text>
  <text x="1185" y="164" class="small" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">ادعای درخواست</text>

  <rect x="870" y="92" width="190" height="100" class="box"/>
  <text x="965" y="132" class="label" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">درگاه API</text>
  <text x="965" y="164" class="small" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">ورودی نامطمئن</text>

  <rect x="650" y="92" width="190" height="100" class="box"/>
  <text x="745" y="132" class="label" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">احراز هویت</text>
  <text x="745" y="164" class="small" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">credential معتبر؟</text>

  <rect x="430" y="92" width="190" height="100" class="box"/>
  <text x="525" y="132" class="label" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">محدودیت نرخ</text>
  <text x="525" y="164" class="small" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">سهمیه و هزینه</text>

  <rect x="210" y="92" width="190" height="100" class="box"/>
  <text x="305" y="132" class="label" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">مجوز منبع</text>
  <text x="305" y="164" class="small" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">action + tenant/object</text>

  <rect x="20" y="92" width="160" height="100" class="box"/>
  <text x="100" y="132" class="label" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">اجرا یا رد</text>
  <text x="100" y="164" class="small" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">نتیجهٔ کنترل‌شده</text>

  <path d="M1090 142 H1065" class="flow"/>
  <path d="M870 142 H845" class="flow"/>
  <path d="M650 142 H625" class="flow"/>
  <path d="M430 142 H405" class="flow"/>
  <path d="M210 142 H185" class="flow"/>

  <line x1="40" y1="224" x2="1280" y2="224" class="rule"/>
  <text x="660" y="264" class="heading" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">شواهد کمینه؛ محتوا از مسیر ثبت جداست</text>

  <rect x="850" y="300" width="250" height="106" class="sensitive"/>
  <text x="975" y="339" class="label" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">محتوای حساس</text>
  <text x="975" y="372" class="small" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">prompt / token / PII</text>
  <text x="975" y="397" class="small" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">✕ در log ممیزی ثبت نشود</text>

  <rect x="505" y="300" width="270" height="106" class="telemetry"/>
  <text x="640" y="339" class="label" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">رخداد ممیزی</text>
  <text x="640" y="372" class="small" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">action، نتیجه، policy version</text>
  <text x="640" y="397" class="small" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">شناسهٔ هم‌بستگیِ کمینه</text>

  <rect x="170" y="300" width="270" height="106" class="telemetry"/>
  <text x="305" y="339" class="label" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">metric / trace</text>
  <text x="305" y="372" class="small" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">outcome، reason code</text>
  <text x="305" y="397" class="small" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">بدون شناسهٔ پرکاردینال</text>

  <path d="M100 192 V244 H640 V290" class="branch"/>
  <path d="M100 192 V238 H305 V290" class="branch"/>
  <path d="M850 353 H798" class="blocked"/>
  <path d="M791 345 L805 361 M805 345 L791 361" fill="none" stroke="#9a3a31" stroke-width="4"/>
  <text x="822" y="334" class="small" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">ممنوع</text>
  <path d="M505 353 H450" class="branch"/>

  <text x="660" y="462" class="small" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">پیکانِ خط‌چین به مرزِ ممنوع می‌رسد؛ دادهٔ حساس به رخداد ممیزی کپی نمی‌شود.</text>
  <line x1="40" y1="486" x2="1280" y2="486" class="rule"/>
  <text x="660" y="526" class="heading" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">از signal تا پاسخِ انسانی</text>

  <rect x="900" y="555" width="240" height="100" class="telemetry"/>
  <text x="1020" y="594" class="label" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">signal و threshold</text>
  <text x="1020" y="627" class="small" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">مالک و اقدام مشخص</text>

  <rect x="555" y="555" width="250" height="100" class="incident"/>
  <text x="680" y="594" class="label" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">triage با شواهد</text>
  <text x="680" y="627" class="small" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">فرضیه، نه نتیجهٔ قطعی</text>

  <rect x="190" y="555" width="270" height="100" class="incident"/>
  <text x="325" y="594" class="label" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">playbook رخداد</text>
  <text x="325" y="627" class="small" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">contain → recover → review</text>

  <path d="M900 605 H815" class="flow"/>
  <path d="M555 605 H470" class="flow"/>
  <path d="M305 406 V530 H1020 V545" class="branch"/>
  <text x="660" y="704" class="small" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">مدل مفهومی برای گفت‌وگو و آزمون؛ نه مدرک پیاده‌سازی یا امنیت یک محصول واقعی.</text>
</svg>
