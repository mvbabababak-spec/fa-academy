<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:xml="http://www.w3.org/XML/1998/namespace" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc" xml:lang="fa">
  <title id="title">فرایند آزمون خصمانه و بازبینی کنترل‌های هوش مصنوعی</title>
  <desc id="desc">فرایند از تعیین دامنه و مجوز به مدل تهدید و آزمون، سپس اجرای کنترل‌های مستقل و ثبت شواهد می‌رسد؛ نتیجه برای اصلاح و آزمون دوباره بازمی‌گردد. چهار سطح آزمون ورودی مستقیم، محتوای بازیابی و ابزار، داده و زنجیرهٔ تأمین، و حریم خصوصی و پرس‌وجو را جدا می‌کنند. خروجی فقط دربارهٔ هدف، سناریو و نسخهٔ آزموده‌شده معتبر است و نمودار تضمین امنیت کلی نمی‌دهد.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 z" fill="#173b63" />
    </marker>
    <marker id="arrow-back" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 z" fill="#5c3566" />
    </marker>
  </defs>
  <rect x="12" y="12" width="1176" height="656" rx="24" fill="#ffffff" stroke="#173b63" stroke-width="3" />
  <text x="600" y="58" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="sans-serif" font-size="28" font-weight="700" fill="#142d4e">چرخهٔ red teaming: از مجوز تا بازآزمون</text>
  <text x="600" y="92" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="sans-serif" font-size="17" fill="#26384a">هر پیکان وابستگی شواهد و تصمیم را نشان می‌دهد؛ هیچ مرحله‌ای به‌تنهایی تضمین ایمنی نیست</text>

  <g stroke="#173b63" stroke-width="3" fill="#f1f6fb">
    <rect x="920" y="145" width="220" height="115" rx="18" />
    <rect x="640" y="145" width="220" height="115" rx="18" />
    <rect x="360" y="145" width="220" height="115" rx="18" />
    <rect x="80" y="145" width="220" height="115" rx="18" />
  </g>
  <g text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="sans-serif" fill="#142d4e">
    <text x="1030" y="185" font-size="22" font-weight="700">۱. دامنه و مجوز</text>
    <text x="1030" y="218" font-size="16">هدف، دارایی، توقف</text>
    <text x="750" y="185" font-size="22" font-weight="700">۲. مدل تهدید</text>
    <text x="750" y="218" font-size="16">مهاجم، سطح دسترسی</text>
    <text x="470" y="185" font-size="22" font-weight="700">۳. آزمون و کنترل</text>
    <text x="470" y="218" font-size="16">ورودی، ابزار، داده</text>
    <text x="190" y="185" font-size="22" font-weight="700">۴. شواهد و اقدام</text>
    <text x="190" y="218" font-size="16">نتیجه، اصلاح، تکرار</text>
  </g>
  <path d="M920 202 H870" fill="none" stroke="#173b63" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M640 202 H590" fill="none" stroke="#173b63" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M360 202 H310" fill="none" stroke="#173b63" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M190 262 V323 H750 V264" fill="none" stroke="#5c3566" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow-back)" />
  <text x="470" y="312" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="sans-serif" font-size="16" fill="#5c3566">اگر خطر یا ابهام بماند: بازنگری دامنه، کنترل و آزمون</text>

  <text x="600" y="376" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="sans-serif" font-size="21" font-weight="700" fill="#142d4e">سطح‌های آزمون را جدا کنید؛ نتیجهٔ هرکدام مخرج و معیار خودش را دارد</text>
  <g stroke="#173b63" stroke-width="2.5" fill="#f8fafc">
    <rect x="875" y="407" width="250" height="82" rx="12" />
    <rect x="600" y="407" width="250" height="82" rx="12" stroke-dasharray="8 5" />
    <rect x="325" y="407" width="250" height="82" rx="12" />
    <rect x="50" y="407" width="250" height="82" rx="12" stroke-dasharray="8 5" />
  </g>
  <g text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="sans-serif" fill="#142d4e">
    <text x="1000" y="443" font-size="18" font-weight="700">ورودی مستقیم</text>
    <text x="1000" y="470" font-size="15">تزریق / دورزدن سیاست</text>
    <text x="725" y="443" font-size="18" font-weight="700">بازیابی و ابزار</text>
    <text x="725" y="470" font-size="15">محتوای نامطمئن / اختیار</text>
    <text x="450" y="443" font-size="18" font-weight="700">داده و زنجیرهٔ مدل</text>
    <text x="450" y="470" font-size="15">منشأ / دست‌کاری / نسخه</text>
    <text x="175" y="443" font-size="18" font-weight="700">حریم خصوصی و API</text>
    <text x="175" y="470" font-size="15">افشا / پرس‌وجو / بودجه</text>
  </g>
  <path d="M1000 407 V387 H470 V263" fill="none" stroke="#60758b" stroke-width="2" />
  <path d="M725 407 V390" fill="none" stroke="#60758b" stroke-width="2" />
  <path d="M450 407 V390" fill="none" stroke="#60758b" stroke-width="2" />
  <path d="M175 407 V390 H190 V263" fill="none" stroke="#60758b" stroke-width="2" />

  <rect x="75" y="526" width="1050" height="92" rx="14" fill="#fff8e8" stroke="#6b4d16" stroke-width="2.5" />
  <text x="600" y="563" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="sans-serif" font-size="18" font-weight="700" fill="#4b3919">گزارش آزمون باید نسخه، روش، مخرج، شکست، اصلاح و محدودیت را ثبت کند</text>
  <text x="600" y="594" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="sans-serif" font-size="16" fill="#4b3919">نمونهٔ ساختگی یا قبولی یک کنترل، مقاومت مدل/محصول را اثبات نمی‌کند</text>
</svg>
