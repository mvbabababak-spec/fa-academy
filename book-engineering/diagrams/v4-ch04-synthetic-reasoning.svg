<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">چرخهٔ ممیزی دادهٔ مصنوعی، آموزش تدریجی و محاسبهٔ زمان آزمون</title>
  <desc id="desc">در نیمهٔ بالا، پرسش‌ها و داده‌های مصنوعی پس از ثبت منشأ، مجوز و split گروهی تولید و با verifier، حذف تکرار و بازبینی انسانی بررسی می‌شوند؛ دادهٔ تأییدشده می‌تواند برای تقطیر پاسخ یا توزیع teacher به student به کار رود. در نیمهٔ پایین، یک درخواست ممکن است چند پاسخ کاندید بسازد و verifier یا رأی self-consistency پاسخ را انتخاب کند؛ تعداد کاندیدها هزینه است و تضمین درستی نیست. کادر جدا curriculum easy-to-hard را یک فرض آزمایش‌پذیر، نه قانون عمومی، معرفی می‌کند.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#264653"/></marker>
    <style>
      text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#152b35}
      .title{font-size:38px;font-weight:700}.label{font-size:26px;font-weight:650}.body{font-size:21px}.small{font-size:18px}
      .box{rx:24;stroke:#264653;stroke-width:3}.line{stroke:#264653;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f7fafc"/>
  <text x="800" y="72" text-anchor="middle" class="title">از دادهٔ ساخته‌شده تا محاسبهٔ آزمون</text>
  <text x="800" y="112" text-anchor="middle" class="body">هر مرحله به منشأ، کنترل مستقل و بودجهٔ سنجش نیاز دارد</text>

  <rect x="70" y="170" width="280" height="175" class="box" fill="#dff3ee"/>
  <text x="210" y="215" text-anchor="middle" class="label">پرسش و seed</text>
  <text x="210" y="255" text-anchor="middle" class="body">انسان، دادهٔ مجاز</text>
  <text x="210" y="287" text-anchor="middle" class="body">یا مسئلهٔ قابل‌راستی‌آزمایی</text>
  <text x="210" y="320" text-anchor="middle" class="small">منشأ و هدف ثبت شود</text>

  <rect x="440" y="170" width="300" height="175" class="box" fill="#fff0c2"/>
  <text x="590" y="215" text-anchor="middle" class="label">تولید مصنوعی</text>
  <text x="590" y="255" text-anchor="middle" class="body">prompt / پاسخ / trace</text>
  <text x="590" y="287" text-anchor="middle" class="body">یا توزیع نرم teacher</text>
  <text x="590" y="320" text-anchor="middle" class="small">خروجی مولد = برچسب درست نیست</text>

  <rect x="830" y="170" width="315" height="175" class="box" fill="#fce1d9"/>
  <text x="988" y="215" text-anchor="middle" class="label">دروازهٔ ممیزی</text>
  <text x="988" y="255" text-anchor="middle" class="body">verifier، dedup، split گروهی</text>
  <text x="988" y="287" text-anchor="middle" class="body">مجوز، privacy، بازبینی</text>
  <text x="988" y="320" text-anchor="middle" class="small">رد، نگه‌داری یا نمونه‌گیری</text>

  <rect x="1240" y="170" width="290" height="175" class="box" fill="#e8e2f5"/>
  <text x="1385" y="215" text-anchor="middle" class="label">تقطیر</text>
  <text x="1385" y="255" text-anchor="middle" class="body">teacher → student</text>
  <text x="1385" y="287" text-anchor="middle" class="body">hard / soft / trace targets</text>
  <text x="1385" y="320" text-anchor="middle" class="small">تعریف هدف، دما و loss</text>
  <path d="M350 258 H430" class="line"/><path d="M740 258 H820" class="line"/><path d="M1145 258 H1230" class="line"/>

  <rect x="105" y="430" width="630" height="210" class="box" fill="#e7f0fb"/>
  <text x="420" y="480" text-anchor="middle" class="label">Curriculum: فرضیهٔ ترتیب</text>
  <text x="420" y="525" text-anchor="middle" class="body">آسان‌تر → میانه → دشوارتر</text>
  <text x="420" y="565" text-anchor="middle" class="body">با baseline مخلوط/تصادفی مقایسه شود</text>
  <text x="420" y="605" text-anchor="middle" class="small">ترتیب و معیار دشواری وابسته به task است</text>

  <rect x="865" y="430" width="630" height="210" class="box" fill="#dff3ee"/>
  <text x="1180" y="480" text-anchor="middle" class="label">ارزیابی student</text>
  <text x="1180" y="525" text-anchor="middle" class="body">دادهٔ تازه، معیار ازپیش‌تعیین‌شده</text>
  <text x="1180" y="565" text-anchor="middle" class="body">کیفیت پاسخ + خطای trace + هزینه</text>
  <text x="1180" y="605" text-anchor="middle" class="small">teacher و benchmark ممکن است خطا داشته باشند</text>

  <rect x="105" y="720" width="360" height="180" class="box" fill="#fff0c2"/>
  <text x="285" y="765" text-anchor="middle" class="label">یک درخواست</text>
  <text x="285" y="810" text-anchor="middle" class="body">بودجهٔ inference</text>
  <text x="285" y="850" text-anchor="middle" class="small">زمان، token، انرژی، هزینه</text>
  <rect x="620" y="720" width="360" height="180" class="box" fill="#fce1d9"/>
  <text x="800" y="765" text-anchor="middle" class="label">چند پاسخ کاندید</text>
  <text x="800" y="810" text-anchor="middle" class="body">نمونه‌گیری / بازنگری / جست‌وجو</text>
  <text x="800" y="850" text-anchor="middle" class="small">وابستگی خطاها و diversity مهم‌اند</text>
  <rect x="1135" y="720" width="360" height="180" class="box" fill="#e8e2f5"/>
  <text x="1315" y="765" text-anchor="middle" class="label">Verifier / aggregation</text>
  <text x="1315" y="810" text-anchor="middle" class="body">انتخاب یا abstain</text>
  <text x="1315" y="850" text-anchor="middle" class="small">رأی اکثریت ≠ حقیقت</text>
  <path d="M465 810 H610" class="line"/><path d="M980 810 H1125" class="line"/>
  <text x="800" y="956" text-anchor="middle" class="small">مقایسه باید کیفیت، پایداری، latency و هزینه را با هم گزارش کند</text>
</svg>
