<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="fig-title fig-desc" xml:lang="fa">
  <title id="fig-title">مسیر سرو در سطح محصول: cache دقیق، صف محدود و microbatch</title>
  <desc id="fig-desc">نمودار مفهومی مسیر یک درخواست ساختگی را نشان می‌دهد: ابتدا cache پاسخ دقیق بررسی می‌شود؛ hit مستقیماً پاسخ می‌گیرد، اما miss به صف FIFO با سقف هشت درخواست منتظر می‌رود. زمان‌بند حداکثر چهار درخواست را با پنجرهٔ انتظار ۱۲ میلی‌ثانیه به یک worker فرضی می‌فرستد. پاسخ پس از محاسبه می‌تواند در cache محدود ذخیره شود. اعداد و ضرایب فقط فرض‌های آموزشی‌اند و benchmark مدل یا GPU واقعی نیستند. مسیرهای hit و miss با برچسب و شکل مسیر، نه با رنگ، از هم متمایزند.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 z" fill="#243246" />
    </marker>
    <marker id="arrow-dash" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 z" fill="#5c6673" />
    </marker>
    <style>
      .bg{fill:#fff}
      .box{fill:#f5f7fa;stroke:#243246;stroke-width:3;rx:18}
      .box2{fill:#fff;stroke:#243246;stroke-width:3;rx:18}
      .title{font:700 30px sans-serif;fill:#162235}
      .subtitle{font:20px sans-serif;fill:#39485b}
      .label{font:700 22px sans-serif;fill:#162235}
      .small{font:18px sans-serif;fill:#26354a}
      .arrow{fill:none;stroke:#243246;stroke-width:4;marker-end:url(#arrow)}
      .cacheline{fill:none;stroke:#5c6673;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#arrow-dash)}
      .chip{fill:#fff;stroke:#66758a;stroke-width:2;rx:12}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="680" />
  <text class="title" x="600" y="55" text-anchor="middle" direction="rtl">سرو در سطح محصول: مسیر hit و miss</text>
  <text class="subtitle" x="600" y="91" text-anchor="middle" direction="rtl">یک worker فرضی؛ اعداد صف و microbatch فقط از fixture آموزشی‌اند</text>

  <rect class="box" x="35" y="282" width="155" height="112" />
  <text class="label" x="112" y="330" text-anchor="middle" direction="rtl">درخواست</text>
  <text class="small" x="112" y="364" text-anchor="middle" direction="rtl">ورود t₀</text>

  <rect class="box" x="230" y="282" width="205" height="112" />
  <text class="label" x="332" y="328" text-anchor="middle" direction="rtl">cache دقیق</text>
  <text class="small" x="332" y="363" text-anchor="middle" direction="rtl">کلید نسخه‌دار</text>

  <rect class="box2" x="500" y="95" width="220" height="112" />
  <text class="label" x="610" y="140" text-anchor="middle" direction="rtl">hit</text>
  <text class="small" x="610" y="176" text-anchor="middle" direction="rtl">پاسخ cache</text>

  <rect class="box" x="490" y="282" width="215" height="128" />
  <text class="label" x="597" y="331" text-anchor="middle" direction="rtl">صف FIFO</text>
  <text class="small" x="597" y="369" text-anchor="middle" direction="rtl">حداکثر ۸ منتظر</text>
  <text class="small" x="597" y="395" text-anchor="middle" direction="rtl">صف پُر: رد</text>

  <rect class="box" x="755" y="282" width="190" height="128" />
  <text class="label" x="850" y="329" text-anchor="middle" direction="rtl">microbatch</text>
  <text class="small" x="850" y="367" text-anchor="middle" direction="rtl">حداکثر ۴ درخواست</text>
  <text class="small" x="850" y="395" text-anchor="middle" direction="rtl">انتظار ≤ ۱۲ ms</text>

  <rect class="box" x="985" y="282" width="180" height="128" />
  <text class="label" x="1075" y="329" text-anchor="middle" direction="rtl">worker</text>
  <text class="small" x="1075" y="367" text-anchor="middle" direction="rtl">مدل فرضی</text>
  <text class="small" x="1075" y="395" text-anchor="middle" direction="rtl">نه GPU واقعی</text>

  <rect class="box2" x="985" y="492" width="180" height="94" />
  <text class="label" x="1075" y="532" text-anchor="middle" direction="rtl">پاسخ</text>
  <text class="small" x="1075" y="562" text-anchor="middle" direction="rtl">latency کامل</text>

  <path class="arrow" d="M190 338 L224 338" />
  <path class="arrow" d="M435 310 C465 290 470 205 495 172" />
  <text class="small" x="463" y="240" text-anchor="middle" direction="rtl">hit</text>
  <path class="arrow" d="M435 366 L484 348" />
  <text class="small" x="457" y="403" text-anchor="middle" direction="rtl">miss</text>
  <path class="arrow" d="M705 346 L749 346" />
  <path class="arrow" d="M945 346 L979 346" />
  <path class="arrow" d="M1075 416 L1075 486" />
  <path class="cacheline" d="M985 540 C830 640 410 632 338 401" />
  <text class="small" x="660" y="625" text-anchor="middle" direction="rtl">ذخیرهٔ پاسخ پس از تکمیل؛ ظرفیت محدود</text>

  <rect class="chip" x="488" y="220" width="236" height="38" />
  <text class="small" x="606" y="246" text-anchor="middle" direction="rtl">hit از صف محاسبه عبور نمی‌کند</text>
  <rect class="chip" x="754" y="436" width="192" height="36" />
  <text class="small" x="850" y="461" text-anchor="middle" direction="rtl">جمع‌شدن درخواست‌ها</text>
</svg>
