<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="v5e-title v5e-desc" xml:lang="fa">
  <title id="v5e-title">زنجیرهٔ طراحی و گزارش ارزیابی</title>
  <desc id="v5e-desc">چهار گام از ادعای محدود و دامنهٔ کاربرد، به سناریو و نمونه‌گیری، سپس اجرای نسخه‌مند و تحلیل سنجه، و در پایان گزارش محدودیت‌ها. پیکان‌های برچسب‌دار وابستگی گام‌ها را نشان می‌دهند. نتیجه فقط برای پروتکل و نمونهٔ تعریف‌شده شاهد است و کیفیت کلی، نبود آلودگی یا ایمنی محصول را تضمین نمی‌کند.</desc>
  <defs>
    <marker id="v5e-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#29445e"/>
    </marker>
    <linearGradient id="v5e-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#edf2f8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#v5e-bg)"/>
  <text x="600" y="65" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Vazirmatn, 'Noto Naskh Arabic', Tahoma, sans-serif" font-size="34" font-weight="700" fill="#10253b">زنجیرهٔ ارزیابی: از ادعا تا گزارش محدود</text>

  <g fill="#ffffff" stroke="#29445e" stroke-width="3">
    <rect x="40" y="175" width="245" height="235" rx="22"/>
    <rect x="345" y="175" width="245" height="235" rx="22"/>
    <rect x="650" y="175" width="245" height="235" rx="22"/>
    <rect x="955" y="175" width="205" height="235" rx="22"/>
  </g>
  <g fill="#e4b96a" stroke="#29445e" stroke-width="2">
    <circle cx="162" cy="225" r="18"/>
    <path d="M467 207 L485 225 L467 243 L449 225 Z"/>
    <path d="M772 207 L790 225 L772 243 L754 225 Z"/>
    <path d="M1057 207 L1075 225 L1057 243 L1039 225 Z"/>
  </g>
  <g font-family="Vazirmatn, 'Noto Naskh Arabic', Tahoma, sans-serif" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">
    <text x="162" y="286" font-size="26" font-weight="700" fill="#10253b">ادعا و دامنه</text>
    <text x="162" y="332" font-size="19" fill="#344b61">تصمیم، جمعیت، کار</text>
    <text x="162" y="365" font-size="17" fill="#52687b">چه چیزی را می‌سنجیم؟</text>

    <text x="467" y="286" font-size="26" font-weight="700" fill="#10253b">سناریو و نمونه</text>
    <text x="467" y="332" font-size="19" fill="#344b61">پوشش، گروه‌بندی، split</text>
    <text x="467" y="365" font-size="17" fill="#52687b">چه کسی و چه داده‌ای؟</text>

    <text x="772" y="286" font-size="26" font-weight="700" fill="#10253b">اجرا و تحلیل</text>
    <text x="772" y="332" font-size="19" fill="#344b61">نسخه، scorer، عدم‌قطعیت</text>
    <text x="772" y="365" font-size="17" fill="#52687b">با کدام قرارداد؟</text>

    <text x="1057" y="286" font-size="25" font-weight="700" fill="#10253b">گزارش محدود</text>
    <text x="1057" y="332" font-size="18" fill="#344b61">اثر، خطا، مرزها</text>
    <text x="1057" y="365" font-size="16" fill="#52687b">فقط برای همین آزمون</text>
  </g>
  <g fill="none" stroke="#29445e" stroke-width="4" marker-end="url(#v5e-arrow)">
    <path d="M292 292 H332"/>
    <path d="M597 292 H637"/>
    <path d="M902 292 H942"/>
  </g>
  <g font-family="Vazirmatn, 'Noto Naskh Arabic', Tahoma, sans-serif" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="15" fill="#52687b">
    <text x="312" y="270">تعریف</text>
    <text x="617" y="270">ثبت</text>
    <text x="922" y="270">تفسیر</text>
  </g>
  <rect x="105" y="478" width="990" height="112" rx="18" fill="#10253b"/>
  <text x="600" y="525" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Vazirmatn, 'Noto Naskh Arabic', Tahoma, sans-serif" font-size="23" font-weight="700" fill="#f3d394">امتیاز بدون نسخهٔ داده، شرایط اجرا و روش سنجش تفسیرپذیر نیست.</text>
  <text x="600" y="563" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Vazirmatn, 'Noto Naskh Arabic', Tahoma, sans-serif" font-size="17" fill="#edf2f8">این نمودار مفهومی است؛ نتیجه، کیفیت کلی یا نبود آلودگی را تضمین نمی‌کند.</text>
</svg>
