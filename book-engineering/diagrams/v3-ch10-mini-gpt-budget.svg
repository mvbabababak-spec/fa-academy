<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc" xml:lang="fa">
  <title id="title">جریان Mini GPT و مصالحهٔ عرض، زمینه و حافظه</title>
  <desc id="desc">سمت چپ جریان توکن‌های ورودی با شکل N در T از embedding توکن و موقعیت به دو بلوک Decoder علّی و logits با شکل N در T در V می‌رود؛ ماسک j بزرگ‌تر از i آینده را می‌بندد و هدف یک خانه جابه‌جا است. سمت راست نمونه‌ای با ۱۱۷٬۳۵۰ پارامتر، حافظه پایدار تقریبی ۱٫۷۹ MiB و اندازهٔ مرجع tensorهای activation ۴٫۴۰ MiB در N برابر ۱۶ و T برابر ۶۴ را نشان می‌دهد؛ این اندازه اوج مصرف GPU نیست. جدول پایین نشان می‌دهد با دوبرابر شدن context از ۶۴ به ۱۲۸، پارامترهای position embedding اندکی زیاد می‌شوند، tensor score-equivalent چهار برابر و FFN دوبرابر می‌شود.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2d517d"/></marker>
    <style>
      .fa { font-family: Vazirmatn, "Noto Sans Arabic", Tahoma, "DejaVu Sans", sans-serif; direction: rtl; unicode-bidi: plaintext; fill: #17253b; }
      .latin { font-family: Inter, Arial, sans-serif; fill: #17253b; font-weight: 700; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #50617a; }
      .head { font-size: 22px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 14px; fill: #50617a; }
      .box { stroke-width: 2.5; rx: 18; }
      .arrow { fill: none; stroke: #2d517d; stroke-width: 4; marker-end: url(#arrow); }
      .grid { stroke: #c8d3e0; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1600" height="1000" rx="28" fill="#f5f8fc"/>
  <text class="fa title" x="800" y="52" text-anchor="middle">Mini GPT را با بودجه طراحی کن، نه با حدس</text>
  <text class="fa subtitle" x="800" y="84" text-anchor="middle">شکل‌ها، تعداد پارامتر، طول زمینه و داده باید با هم سازگار باشند</text>

  <rect x="40" y="112" width="900" height="380" rx="24" fill="#ffffff" stroke="#d0dbe8" stroke-width="2"/>
  <text class="fa head" x="490" y="148" text-anchor="middle">مسیر forward و قرارداد ابعاد</text>
  <rect class="box" x="65" y="185" width="145" height="92" fill="#e9f1fa" stroke="#4776a5"/>
  <text class="latin" x="137" y="220" text-anchor="middle" font-size="20">token IDs</text><text class="latin" x="137" y="251" text-anchor="middle" font-size="16">[N, T]</text>
  <rect class="box" x="250" y="185" width="185" height="92" fill="#edf5f0" stroke="#4c856a"/>
  <text class="fa head" x="342" y="220" text-anchor="middle">Embedding</text><text class="latin" x="342" y="251" text-anchor="middle" font-size="16">token + position</text>
  <rect class="box" x="475" y="172" width="210" height="118" fill="#f0edfa" stroke="#7162a0"/>
  <text class="latin" x="580" y="209" text-anchor="middle" font-size="19">Decoder block × L</text><text class="latin" x="580" y="241" text-anchor="middle" font-size="16">causal self-attention</text><text class="latin" x="580" y="269" text-anchor="middle" font-size="15">+ FFN + residual + norm</text>
  <rect class="box" x="730" y="185" width="175" height="92" fill="#fff3df" stroke="#b07a2c"/>
  <text class="latin" x="817" y="220" text-anchor="middle" font-size="20">logits</text><text class="latin" x="817" y="251" text-anchor="middle" font-size="16">[N, T, V]</text>
  <path class="arrow" d="M210 231 L242 231"/><path class="arrow" d="M435 231 L467 231"/><path class="arrow" d="M685 231 L722 231"/>
  <text class="fa body" x="490" y="333" text-anchor="middle">در ماسک علّی، هر خانه‌ای که کلیدش پس از جایگاه پرس‌وجو است بسته می‌شود.</text>
  <text class="latin" x="490" y="366" text-anchor="middle" font-size="17">input: x[0:T]  →  target: x[1:T+1]</text>
  <rect x="84" y="392" width="800" height="68" rx="14" fill="#f7f9fc" stroke="#d5deea"/>
  <text class="latin" x="484" y="420" text-anchor="middle" font-size="16">causal mask  [T,T]</text><text class="latin" x="484" y="446" text-anchor="middle" font-size="15">j ≤ i: allowed     |     j &gt; i: blocked</text>

  <rect x="970" y="112" width="590" height="380" rx="24" fill="#ffffff" stroke="#d0dbe8" stroke-width="2"/>
  <text class="fa head" x="1265" y="148" text-anchor="middle">نمونهٔ بودجه — نه benchmark</text>
  <text class="latin" x="1265" y="191" text-anchor="middle" font-size="19">V=102 · C=64 · d=64 · h=4 · f=256 · L=2</text>
  <rect x="1010" y="215" width="235" height="94" rx="15" fill="#edf5f0" stroke="#4c856a" stroke-width="2"/>
  <text class="fa small" x="1127" y="244" text-anchor="middle">پارامتر دقیق</text><text class="latin" x="1127" y="279" text-anchor="middle" font-size="23">117,350</text>
  <rect x="1280" y="215" width="235" height="94" rx="15" fill="#e9f1fa" stroke="#4776a5" stroke-width="2"/>
  <text class="fa small" x="1397" y="244" text-anchor="middle">وزن + گرادیان + AdamW</text><text class="latin" x="1397" y="279" text-anchor="middle" font-size="23">1.79 MiB</text>
  <rect x="1010" y="329" width="505" height="93" rx="15" fill="#fff3df" stroke="#b07a2c" stroke-width="2"/>
  <text class="fa small" x="1262" y="358" text-anchor="middle">N=16، T=64؛ score-equivalent + FFN hidden + logits</text><text class="latin" x="1262" y="395" text-anchor="middle" font-size="23">4.40 MiB reference tensors</text>
  <text class="fa small" x="1262" y="451" text-anchor="middle">این جمع، اوج حافظه یا تخصیص واقعیِ اجرا را نشان نمی‌دهد</text>

  <rect x="40" y="525" width="1520" height="390" rx="24" fill="#ffffff" stroke="#d0dbe8" stroke-width="2"/>
  <text class="fa head" x="800" y="566" text-anchor="middle">اگر فقط طول زمینه را از ۳۲ به ۱۲۸ تغییر دهیم، چه چیزی رشد می‌کند؟</text>
  <text class="fa small" x="800" y="596" text-anchor="middle">در هر ردیف: N=16، d=64، h=4، f=256، L=2، V=102؛ FP32 برای tensorهای مرجع</text>
  <rect x="90" y="628" width="1420" height="52" fill="#eaf0f7"/>
  <text class="fa head" x="215" y="661" text-anchor="middle">زمینه</text><text class="latin" x="490" y="661" text-anchor="middle" font-size="17">parameters</text><text class="latin" x="790" y="661" text-anchor="middle" font-size="17">persistent estimate</text><text class="latin" x="1110" y="661" text-anchor="middle" font-size="17">score-equivalent</text><text class="latin" x="1380" y="661" text-anchor="middle" font-size="17">FFN hidden + logits</text>
  <line class="grid" x1="90" y1="680" x2="1510" y2="680"/><line class="grid" x1="90" y1="753" x2="1510" y2="753"/><line class="grid" x1="90" y1="826" x2="1510" y2="826"/><line class="grid" x1="90" y1="899" x2="1510" y2="899"/><line class="grid" x1="350" y1="628" x2="350" y2="899"/><line class="grid" x1="630" y1="628" x2="630" y2="899"/><line class="grid" x1="950" y1="628" x2="950" y2="899"/><line class="grid" x1="1260" y1="628" x2="1260" y2="899"/>
  <text class="latin" x="215" y="725" text-anchor="middle" font-size="18">32</text><text class="latin" x="490" y="725" text-anchor="middle" font-size="18">115,302</text><text class="latin" x="790" y="725" text-anchor="middle" font-size="18">1.76 MiB</text><text class="latin" x="1110" y="725" text-anchor="middle" font-size="18">0.50 MiB</text><text class="latin" x="1380" y="725" text-anchor="middle" font-size="18">1.20 MiB</text>
  <text class="latin" x="215" y="798" text-anchor="middle" font-size="18">64</text><text class="latin" x="490" y="798" text-anchor="middle" font-size="18">117,350</text><text class="latin" x="790" y="798" text-anchor="middle" font-size="18">1.79 MiB</text><text class="latin" x="1110" y="798" text-anchor="middle" font-size="18">2.00 MiB</text><text class="latin" x="1380" y="798" text-anchor="middle" font-size="18">2.40 MiB</text>
  <text class="latin" x="215" y="871" text-anchor="middle" font-size="18">128</text><text class="latin" x="490" y="871" text-anchor="middle" font-size="18">121,446</text><text class="latin" x="790" y="871" text-anchor="middle" font-size="18">1.85 MiB</text><text class="latin" x="1110" y="871" text-anchor="middle" font-size="18">8.00 MiB</text><text class="latin" x="1380" y="871" text-anchor="middle" font-size="18">4.80 MiB</text>
  <rect x="90" y="928" width="1420" height="42" rx="12" fill="#f1f5f9"/>
  <text class="fa small" x="800" y="956" text-anchor="middle">پارامترهای موقعیت با طول زمینه خطی زیاد می‌شوند؛ اندازهٔ score با مربع طول رشد می‌کند؛ این هزینهٔ واقعی آموزش نیست</text>
</svg>
