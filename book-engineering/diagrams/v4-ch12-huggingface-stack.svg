<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">خط لولهٔ آفلاین فصل ۱۲ جلد چهارم با ابزارهای Hugging Face</title>
  <desc id="desc">شش مرحله از چپ به راست: فایل JSONL ساختگی و hash؛ Dataset و split گروهی؛ tokenizer محلی که فقط با train ساخته می‌شود؛ batch پدشده؛ مدل Transformers با وزن تصادفی؛ و اجرای دو گام CPU با Accelerate. هیچ داده یا مدل از Hub دریافت نمی‌شود و این نمودار benchmark یا نتیجهٔ کیفیت نیست.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#54708e"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9ff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" rx="34" fill="url(#bg)"/>
  <text x="800" y="115" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="700" fill="#172a45" direction="rtl">از فایل محلی تا smoke test آفلاین</text>
  <text x="800" y="174" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#526882" direction="rtl">هر مرحله قرارداد و خروجی خودش را دارد؛ وزن pretrained یا دادهٔ واقعی در این پروژه نیست.</text>

  <g fill="none" stroke="#54708e" stroke-width="7" marker-end="url(#arrow)">
    <path d="M275 498 H317"/>
    <path d="M530 498 H572"/>
    <path d="M785 498 H827"/>
    <path d="M1040 498 H1082"/>
    <path d="M1295 498 H1337"/>
  </g>

  <g font-family="sans-serif" text-anchor="middle">
    <g>
      <rect x="55" y="330" width="220" height="335" rx="26" fill="#ffffff" stroke="#74a8d7" stroke-width="4"/>
      <circle cx="165" cy="390" r="31" fill="#e5f1ff"/>
      <text x="165" y="401" font-size="29" font-weight="700" fill="#24649a">۱</text>
      <text x="165" y="470" font-size="24" font-weight="700" fill="#172a45" direction="rtl">فایل محلی</text>
      <text x="165" y="528" font-size="19" fill="#526882" direction="rtl">JSONL ساختگی</text>
      <text x="165" y="564" font-size="19" fill="#526882" direction="rtl">schema + SHA-256</text>
      <text x="165" y="620" font-size="17" fill="#24724b" direction="rtl">بدون دانلود Hub</text>
    </g>
    <g>
      <rect x="310" y="330" width="220" height="335" rx="26" fill="#ffffff" stroke="#74a8d7" stroke-width="4"/>
      <circle cx="420" cy="390" r="31" fill="#e5f1ff"/>
      <text x="420" y="401" font-size="29" font-weight="700" fill="#24649a">۲</text>
      <text x="420" y="470" font-size="24" font-weight="700" fill="#172a45">Datasets</text>
      <text x="420" y="528" font-size="19" fill="#526882" direction="rtl">Features و split</text>
      <text x="420" y="564" font-size="19" fill="#526882" direction="rtl">گروه‌ها جدا</text>
      <text x="420" y="620" font-size="17" fill="#24724b" direction="rtl">train / validation</text>
    </g>
    <g>
      <rect x="565" y="330" width="220" height="335" rx="26" fill="#ffffff" stroke="#74a8d7" stroke-width="4"/>
      <circle cx="675" cy="390" r="31" fill="#e5f1ff"/>
      <text x="675" y="401" font-size="29" font-weight="700" fill="#24649a">۳</text>
      <text x="675" y="470" font-size="24" font-weight="700" fill="#172a45">Tokenizers</text>
      <text x="675" y="528" font-size="19" fill="#526882" direction="rtl">BPE روی train</text>
      <text x="675" y="564" font-size="19" fill="#526882" direction="rtl">special tokenها</text>
      <text x="675" y="620" font-size="17" fill="#24724b" direction="rtl">متن ← شناسه</text>
    </g>
    <g>
      <rect x="820" y="330" width="220" height="335" rx="26" fill="#ffffff" stroke="#74a8d7" stroke-width="4"/>
      <circle cx="930" cy="390" r="31" fill="#e5f1ff"/>
      <text x="930" y="401" font-size="29" font-weight="700" fill="#24649a">۴</text>
      <text x="930" y="470" font-size="24" font-weight="700" fill="#172a45" direction="rtl">Batch</text>
      <text x="930" y="528" font-size="19" fill="#526882" direction="rtl">Collator</text>
      <text x="930" y="564" font-size="19" fill="#526882" direction="rtl">padding + mask</text>
      <text x="930" y="620" font-size="17" fill="#24724b" direction="rtl">shape قابل آزمون</text>
    </g>
    <g>
      <rect x="1075" y="330" width="220" height="335" rx="26" fill="#ffffff" stroke="#74a8d7" stroke-width="4"/>
      <circle cx="1185" cy="390" r="31" fill="#e5f1ff"/>
      <text x="1185" y="401" font-size="29" font-weight="700" fill="#24649a">۵</text>
      <text x="1185" y="470" font-size="24" font-weight="700" fill="#172a45">Transformers</text>
      <text x="1185" y="528" font-size="19" fill="#526882" direction="rtl">BERT از config</text>
      <text x="1185" y="564" font-size="19" fill="#526882" direction="rtl">وزن تصادفی</text>
      <text x="1185" y="620" font-size="17" fill="#24724b" direction="rtl">نه pretrained</text>
    </g>
    <g>
      <rect x="1330" y="330" width="220" height="335" rx="26" fill="#ffffff" stroke="#74a8d7" stroke-width="4"/>
      <circle cx="1440" cy="390" r="31" fill="#e5f1ff"/>
      <text x="1440" y="401" font-size="29" font-weight="700" fill="#24649a">۶</text>
      <text x="1440" y="470" font-size="24" font-weight="700" fill="#172a45">Accelerate</text>
      <text x="1440" y="528" font-size="19" fill="#526882" direction="rtl">prepare + backward</text>
      <text x="1440" y="564" font-size="19" fill="#526882" direction="rtl">دو گام روی CPU</text>
      <text x="1440" y="620" font-size="17" fill="#24724b" direction="rtl">smoke test</text>
    </g>
  </g>

  <rect x="130" y="755" width="1340" height="120" rx="24" fill="#e7f4ee" stroke="#79b292" stroke-width="3"/>
  <text x="800" y="805" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#21563a" direction="rtl">در manifest ثبت کنید</text>
  <text x="800" y="846" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#35654d" direction="rtl">نسخه‌ها • hash • split • tokenizer • device • آنچه استفاده یا اندازه‌گیری نشده است</text>
  <text x="800" y="934" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#6b7c91" direction="rtl">نمودار مسیر اجراست؛ نه benchmark، نتیجهٔ کیفیت یا ادعای مقیاس‌پذیری.</text>
</svg>
