<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">دفترچهٔ برآورد منابع مدل</title>
  <desc id="desc">مقایسهٔ سه workload: استنتاج با وزن و KV cache؛ Fine-tuning با وزن پایه و حالت‌های پارامترهای trainable؛ و آموزش از صفر با وزن، gradient، optimizer، activation و تقریب 6ND. در پایان، اجرای کوچک و سنجش واقعی از برآورد فرمولی جدا می‌شوند.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#142338"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143e62"/>
      <stop offset="1" stop-color="#102d49"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#452a68"/>
      <stop offset="1" stop-color="#2a1d46"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#70421f"/>
      <stop offset="1" stop-color="#49301e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1430" cy="90" r="240" fill="#2563eb" opacity="0.07"/>
  <circle cx="160" cy="830" r="270" fill="#a855f7" opacity="0.07"/>
  <g font-family="Tahoma, Arial, sans-serif" text-anchor="middle">
    <text x="800" y="92" fill="#f8fafc" font-size="42" font-weight="700">دفترچهٔ برآورد منابع مدل</text>
    <text x="800" y="143" fill="#bdc9d8" font-size="24">از workload و فرض‌های ثبت‌شده شروع کنید؛ هر مؤلفه را جدا حساب کنید</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="88" y="205" width="448" height="500" rx="28" fill="url(#blue)" stroke="#46b4f7" stroke-width="2"/>
    <rect x="576" y="205" width="448" height="500" rx="28" fill="url(#purple)" stroke="#c084fc" stroke-width="2"/>
    <rect x="1064" y="205" width="448" height="500" rx="28" fill="url(#orange)" stroke="#fbbf24" stroke-width="2"/>
  </g>

  <g font-family="Tahoma, Arial, sans-serif" text-anchor="middle">
    <text x="312" y="267" fill="#7dd3fc" font-size="32" font-weight="700">استنتاج</text>
    <text x="312" y="326" fill="#f8fafc" font-size="25" font-weight="700">وزن‌های مستقر</text>
    <text x="312" y="366" fill="#dbeafe" font-size="23">N × b_w</text>
    <line x1="145" y1="396" x2="479" y2="396" stroke="#7dd3fc" stroke-opacity="0.4"/>
    <text x="312" y="442" fill="#f8fafc" font-size="25" font-weight="700">KV cache</text>
    <text x="312" y="481" fill="#dbeafe" font-size="20">2 × L × B × T × H_KV</text>
    <text x="312" y="514" fill="#dbeafe" font-size="20">× d_head × b_KV</text>
    <line x1="145" y1="544" x2="479" y2="544" stroke="#7dd3fc" stroke-opacity="0.4"/>
    <text x="312" y="590" fill="#f8fafc" font-size="22">+ workspace / runtime</text>
    <text x="312" y="626" fill="#f8fafc" font-size="22">+ safety reserve</text>
    <text x="312" y="670" fill="#a8c8de" font-size="17">batch و context، اندازهٔ cache را تغییر می‌دهند</text>

    <text x="800" y="267" fill="#e9d5ff" font-size="32" font-weight="700">Fine-tuning</text>
    <text x="800" y="326" fill="#f8fafc" font-size="25" font-weight="700">وزن پایه</text>
    <text x="800" y="366" fill="#f3e8ff" font-size="23">همهٔ N هنوز در دسترس‌اند</text>
    <line x1="633" y1="396" x2="967" y2="396" stroke="#d8b4fe" stroke-opacity="0.4"/>
    <text x="800" y="442" fill="#f8fafc" font-size="23" font-weight="700">حالت‌های trainable</text>
    <text x="800" y="481" fill="#f3e8ff" font-size="20">gradient + master + optimizer</text>
    <text x="800" y="514" fill="#f3e8ff" font-size="20">برای N_t، نه لزوماً همهٔ N</text>
    <line x1="633" y1="544" x2="967" y2="544" stroke="#d8b4fe" stroke-opacity="0.4"/>
    <text x="800" y="590" fill="#f8fafc" font-size="22">+ activation / temporary</text>
    <text x="800" y="626" fill="#f8fafc" font-size="22">+ buffer / runtime</text>
    <text x="800" y="670" fill="#c7b6dd" font-size="17">LoRA stateها را کم می‌کند؛ مدل پایه را پاک نمی‌کند</text>

    <text x="1288" y="267" fill="#fde68a" font-size="32" font-weight="700">آموزش از صفر</text>
    <text x="1288" y="326" fill="#f8fafc" font-size="25" font-weight="700">حافظهٔ حالت‌ها</text>
    <text x="1288" y="366" fill="#fef3c7" font-size="21">وزن + gradient + master</text>
    <text x="1288" y="399" fill="#fef3c7" font-size="21">+ optimizer</text>
    <line x1="1121" y1="425" x2="1455" y2="425" stroke="#fcd34d" stroke-opacity="0.4"/>
    <text x="1288" y="471" fill="#f8fafc" font-size="23" font-weight="700">فعال‌سازی‌ها</text>
    <text x="1288" y="510" fill="#fef3c7" font-size="20">تابع B, T, H, L و اجرا</text>
    <line x1="1121" y1="540" x2="1455" y2="540" stroke="#fcd34d" stroke-opacity="0.4"/>
    <text x="1288" y="590" fill="#f8fafc" font-size="23" font-weight="700">محاسبهٔ مرتبهٔ اول</text>
    <text x="1288" y="633" fill="#fef3c7" font-size="24">C ≈ 6ND</text>
    <text x="1288" y="670" fill="#dfc6a5" font-size="17">FLOPs به‌تنهایی زمان اجرا نیست</text>
  </g>

  <rect x="88" y="753" width="1424" height="112" rx="22" fill="#0a1727" stroke="#334155" stroke-width="2"/>
  <g font-family="Tahoma, Arial, sans-serif" text-anchor="middle">
    <text x="800" y="797" fill="#f8fafc" font-size="26" font-weight="700">فرایند برآورد</text>
    <text x="800" y="839" fill="#cbd5e1" font-size="22">۱. فرض‌ها را ثبت کن　 ←　 ۲. اجزا را حساب کن　 ←　 ۳. اجرای کوچک　 ←　 ۴. peak را اندازه بگیر</text>
  </g>

  <rect x="88" y="894" width="1424" height="62" rx="17" fill="#281d13" stroke="#f59e0b" stroke-width="1.5"/>
  <g font-family="Tahoma, Arial, sans-serif" text-anchor="middle">
    <text x="800" y="934" fill="#fde68a" font-size="21">فرمول ≠ benchmark　•　fixture ساختگی است　•　قطعات/آزمایشگاه: فصل ۵۵　•　بودجه و هزینه: فصل ۵۶</text>
  </g>
</svg>
