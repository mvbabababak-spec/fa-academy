<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc" xml:lang="fa">
  <title id="title" xml:lang="fa">مسیر طراحی معماری و برنامهٔ پژوهشی</title>
  <desc id="desc" xml:lang="fa">نمودار مفهومی راست‌به‌چپ. ردیف بالا از راست به چپ مسئله و بافت، نقشهٔ کارهای پیشین، فرضیهٔ معماری و گزینه‌ها و مصالحه‌ها را نشان می‌دهد. مسیر سپس به ردیف پایین می‌رود و از طرح ارزیابی به ادعا و مقاله و سپس تیم و برنامهٔ پژوهشی می‌رسد. یک پیکان خط‌چین از انتهای مسیر به آغاز بازمی‌گردد تا بازبینی و اصلاح را نشان دهد. این نمودار طرح فرایند است، نه اجرای مدل یا نتیجهٔ تجربی؛ معنا به رنگ وابسته نیست.
  </desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#25344a" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#525f70" />
    </marker>
    <style>
      .box { fill: #f4f7fb; stroke: #25344a; stroke-width: 2.5; rx: 16; }
      .box-alt { fill: #fffaf0; stroke: #25344a; stroke-width: 2.5; rx: 16; }
      .label { fill: #132238; font-family: sans-serif; font-size: 24px; font-weight: 700; text-anchor: middle; direction: rtl; unicode-bidi: plaintext; }
      .sub { fill: #26374d; font-family: sans-serif; font-size: 17px; text-anchor: middle; direction: rtl; unicode-bidi: plaintext; }
      .step { fill: #ffffff; stroke: #25344a; stroke-width: 2; }
      .step-text { fill: #132238; font-family: sans-serif; font-size: 16px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .flow { fill: none; stroke: #25344a; stroke-width: 3; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #525f70; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow-muted); }
      .flow-label { fill: #26374d; font-family: sans-serif; font-size: 17px; font-weight: 600; text-anchor: middle; direction: rtl; unicode-bidi: plaintext; }
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="680" fill="#ffffff" />
  <text x="600" y="34" class="flow-label" xml:lang="fa">از تعریف مسئله تا مقاله و برنامهٔ پژوهشی</text>

  <path class="flow" d="M900 120 H870" />
  <path class="flow" d="M610 120 H580" />
  <path class="flow" d="M320 120 H290" />
  <path class="flow" d="M160 170 V300 H1020 V380" />
  <path class="flow" d="M900 440 H870" />
  <path class="flow" d="M610 440 H580" />
  <path class="feedback" d="M320 440 C250 510 70 525 40 430 C12 340 20 120 20 70 C20 58 650 58 900 58 L900 86" />
  <text x="170" y="250" class="flow-label" xml:lang="fa">گزینه‌ها به طرح ارزیابی می‌رسند</text>
  <text x="530" y="600" class="flow-label" xml:lang="fa">بازخورد: بازنگری در مسئله، فرضیه یا تصمیم</text>

  <g>
    <rect class="box" x="900" y="70" width="240" height="100" />
    <circle class="step" cx="1118" cy="82" r="18" /><text class="step-text" x="1118" y="82">۱</text>
    <text class="label" x="1020" y="112" xml:lang="fa">مسئله و بافت</text>
    <text class="sub" x="1020" y="143" xml:lang="fa">مرز و پرسش روشن</text>
  </g>
  <g>
    <rect class="box" x="610" y="70" width="240" height="100" />
    <circle class="step" cx="828" cy="82" r="18" /><text class="step-text" x="828" y="82">۲</text>
    <text class="label" x="730" y="112" xml:lang="fa">کارهای پیشین</text>
    <text class="sub" x="730" y="143" xml:lang="fa">جایگاه و شکاف مستند</text>
  </g>
  <g>
    <rect class="box" x="320" y="70" width="260" height="100" />
    <circle class="step" cx="558" cy="82" r="18" /><text class="step-text" x="558" y="82">۳</text>
    <text class="label" x="450" y="112" xml:lang="fa">فرضیهٔ معماری</text>
    <text class="sub" x="450" y="143" xml:lang="fa">سازوکار و شرط رد</text>
  </g>
  <g>
    <rect class="box-alt" x="30" y="70" width="240" height="100" />
    <circle class="step" cx="248" cy="82" r="18" /><text class="step-text" x="248" y="82">۴</text>
    <text class="label" x="150" y="112" xml:lang="fa">گزینه و مصالحه</text>
    <text class="sub" x="150" y="143" xml:lang="fa">ریسک و تصمیم ثبت‌شده</text>
  </g>
  <g>
    <rect class="box-alt" x="900" y="390" width="240" height="100" />
    <circle class="step" cx="1118" cy="402" r="18" /><text class="step-text" x="1118" y="402">۵</text>
    <text class="label" x="1020" y="432" xml:lang="fa">طرح ارزیابی</text>
    <text class="sub" x="1020" y="463" xml:lang="fa">پرسش و شواهد لازم</text>
  </g>
  <g>
    <rect class="box" x="610" y="390" width="240" height="100" />
    <circle class="step" cx="828" cy="402" r="18" /><text class="step-text" x="828" y="402">۶</text>
    <text class="label" x="730" y="432" xml:lang="fa">ادعا و مقاله</text>
    <text class="sub" x="730" y="463" xml:lang="fa">متناسب با شواهد</text>
  </g>
  <g>
    <rect class="box" x="320" y="390" width="260" height="100" />
    <circle class="step" cx="558" cy="402" r="18" /><text class="step-text" x="558" y="402">۷</text>
    <text class="label" x="450" y="432" xml:lang="fa">تیم و نقشهٔ راه</text>
    <text class="sub" x="450" y="463" xml:lang="fa">نقش، گیت و بازنگری</text>
  </g>
</svg>
