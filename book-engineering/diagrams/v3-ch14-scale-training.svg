<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">مقیاس‌پذیری آموزش؛ وضعیت، شواهد و بازیابی</title>
  <desc id="desc">نموداری دوزبانه از یک به‌روزرسانی داده‌موازی در دو رتبه، هم‌جمعی گرادیان، بازمحاسبهٔ فعال‌سازی، تقسیم وضعیت مدل و ذخیرهٔ هماهنگ همراه با گزارش اجرا برای ادامهٔ قابل‌بازیابی.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#53657a"/></marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#2764c5"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#18845c"/></marker>
    <style>
      text { font-family: "Vazirmatn", "DejaVu Sans", sans-serif; }
      .rtl { direction: ltr; unicode-bidi: plaintext; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f4f7fb"/>
  <text class="rtl" x="800" y="64" text-anchor="middle" font-size="33" font-weight="700" fill="#162a43">مقیاس‌پذیری آموزش؛ وضعیت، شواهد و بازیابی</text>
  <text class="rtl" x="800" y="101" text-anchor="middle" font-size="18" fill="#53657a">طرح مفهومی است؛ حافظه، ارتباط و سرعت به مدل و سخت‌افزار وابسته‌اند.</text>

  <rect x="66" y="140" width="1468" height="396" rx="24" fill="#ffffff" stroke="#c9d5e3" stroke-width="2"/>
  <text class="rtl" x="1494" y="185" text-anchor="end" font-size="23" font-weight="700" fill="#203955">۱ · یک گام داده‌موازی و همگام‌سازی رتبه‌ها</text>

  <rect x="105" y="224" width="205" height="92" rx="14" fill="#e8f0ff" stroke="#8bb0ee" stroke-width="2"/>
  <text class="rtl" x="207" y="258" text-anchor="middle" font-size="16" font-weight="700" fill="#164b9b">دستهٔ کلی</text>
  <text class="rtl" x="207" y="284" text-anchor="middle" font-size="13" fill="#315d99">global batch · sampler</text>

  <path d="M310 270 H365 V253 H410" fill="none" stroke="#53657a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M365 270 V365 H410" fill="none" stroke="#53657a" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="414" y="211" width="294" height="112" rx="16" fill="#ecf7ff" stroke="#85c2e8" stroke-width="2"/>
  <text class="rtl" x="561" y="237" text-anchor="middle" font-size="19" font-weight="700" fill="#174d6a">رتبه</text>
  <text class="rtl" x="561" y="258" text-anchor="middle" font-size="13" fill="#426b82">rank 0 · shard A</text>
  <rect x="454" y="269" width="93" height="38" rx="8" fill="#ffffff" stroke="#96bfd5"/>
  <text class="rtl" x="500" y="293" text-anchor="middle" font-size="14" fill="#28485a">forward</text>
  <rect x="566" y="269" width="102" height="38" rx="8" fill="#ffffff" stroke="#96bfd5"/>
  <text class="rtl" x="617" y="293" text-anchor="middle" font-size="14" fill="#28485a">backward</text>

  <rect x="414" y="324" width="294" height="112" rx="16" fill="#f2f8ed" stroke="#a6ca86" stroke-width="2"/>
  <text class="rtl" x="561" y="350" text-anchor="middle" font-size="19" font-weight="700" fill="#426b25">رتبه</text>
  <text class="rtl" x="561" y="371" text-anchor="middle" font-size="13" fill="#587246">rank 1 · shard B</text>
  <rect x="454" y="382" width="93" height="38" rx="8" fill="#ffffff" stroke="#b3c99e"/>
  <text class="rtl" x="500" y="406" text-anchor="middle" font-size="14" fill="#405936">forward</text>
  <rect x="566" y="382" width="102" height="38" rx="8" fill="#ffffff" stroke="#b3c99e"/>
  <text class="rtl" x="617" y="406" text-anchor="middle" font-size="14" fill="#405936">backward</text>

  <path d="M709 280 H760 V321 H804" fill="none" stroke="#2764c5" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M709 390 H760 V346 H804" fill="none" stroke="#18845c" stroke-width="3" marker-end="url(#arrow-green)"/>
  <rect x="808" y="280" width="238" height="112" rx="16" fill="#f3edff" stroke="#b49bdd" stroke-width="2"/>
  <text class="rtl" x="927" y="308" text-anchor="middle" font-size="17" font-weight="700" fill="#5d3c92">هم‌جمعی گرادیان</text>
  <text class="rtl" x="927" y="329" text-anchor="middle" font-size="13" fill="#695882">AllReduce</text>
  <text class="rtl" x="927" y="352" text-anchor="middle" font-size="12" fill="#695882">به‌روزرسانی یکسان در رتبه‌ها</text>
  <text class="rtl" x="927" y="374" text-anchor="middle" font-size="12" fill="#695882">وزن تابع زیان متناسب با نمونه</text>

  <path d="M1047 336 H1110" fill="none" stroke="#53657a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1115" y="280" width="205" height="112" rx="16" fill="#fff2df" stroke="#e6ba75" stroke-width="2"/>
  <text class="rtl" x="1217" y="308" text-anchor="middle" font-size="18" font-weight="700" fill="#8a5510">گام بهینه‌ساز</text>
  <text class="rtl" x="1217" y="330" text-anchor="middle" font-size="13" fill="#80643d">optimizer step</text>
  <text class="rtl" x="1217" y="354" text-anchor="middle" font-size="13" fill="#80643d">یک بار پس از هم‌جمعی</text>
  <text class="rtl" x="1217" y="375" text-anchor="middle" font-size="12" fill="#80643d">گرادیان‌ها</text>
  <text class="rtl" x="1390" y="304" text-anchor="middle" font-size="15" font-weight="700" fill="#203955">یک طرح</text>
  <text class="rtl" x="1390" y="328" text-anchor="middle" font-size="15" font-weight="700" fill="#203955">همگانی</text>
  <text class="rtl" x="1390" y="352" text-anchor="middle" font-size="15" font-weight="700" fill="#203955">وجود ندارد</text>
  <text class="rtl" x="1390" y="380" text-anchor="middle" font-size="13" fill="#53657a">DP · FSDP / ZeRO</text>
  <text class="rtl" x="1390" y="401" text-anchor="middle" font-size="13" fill="#53657a">TP · PP · hybrid</text>

  <rect x="66" y="563" width="706" height="352" rx="24" fill="#ffffff" stroke="#c9d5e3" stroke-width="2"/>
  <text class="rtl" x="734" y="611" text-anchor="end" font-size="23" font-weight="700" fill="#203955">۲ · مصالحهٔ حافظه: دو سازوکار متفاوت</text>
  <rect x="108" y="647" width="268" height="116" rx="16" fill="#eaf4ff" stroke="#83addd" stroke-width="2"/>
  <text class="rtl" x="242" y="678" text-anchor="middle" font-size="17" font-weight="700" fill="#235b98">بازمحاسبهٔ فعال‌سازی</text>
  <text class="rtl" x="242" y="699" text-anchor="middle" font-size="12" fill="#415d7a">activation recomputation</text>
  <text class="rtl" x="242" y="728" text-anchor="middle" font-size="13" fill="#415d7a">بازسازی بخش‌های برگزیده</text>
  <text class="rtl" x="242" y="749" text-anchor="middle" font-size="13" fill="#415d7a">هنگام پس‌انتشار</text>
  <path d="M378 704 H439" fill="none" stroke="#53657a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="444" y="647" width="278" height="116" rx="16" fill="#f2f8ed" stroke="#a6ca86" stroke-width="2"/>
  <text class="rtl" x="583" y="678" text-anchor="middle" font-size="17" font-weight="700" fill="#426b25">تقسیم وضعیت</text>
  <text class="rtl" x="583" y="699" text-anchor="middle" font-size="12" fill="#536a43">state sharding</text>
  <text class="rtl" x="583" y="728" text-anchor="middle" font-size="13" fill="#536a43">پارامتر · گرادیان · بهینه‌ساز</text>
  <text class="rtl" x="583" y="749" text-anchor="middle" font-size="13" fill="#536a43">حافظهٔ کمتر؛ ارتباط بیشتر</text>
  <text class="rtl" x="734" y="808" text-anchor="end" font-size="15" font-weight="700" fill="#a14c39">بازمحاسبهٔ فعال‌سازی با ذخیرهٔ وضعیت آموزش یکی نیست</text>
  <text class="rtl" x="734" y="839" text-anchor="end" font-size="14" fill="#53657a">اولی، فعال‌سازی‌های منتخب را هنگام پس‌انتشار دوباره می‌سازد.</text>
  <text class="rtl" x="734" y="864" text-anchor="end" font-size="14" fill="#53657a">دومی، وضعیت سازگار اجرا را برای بازیابی ذخیره می‌کند.</text>

  <rect x="806" y="563" width="728" height="352" rx="24" fill="#ffffff" stroke="#c9d5e3" stroke-width="2"/>
  <text class="rtl" x="1494" y="611" text-anchor="end" font-size="23" font-weight="700" fill="#203955">۳ · اجرای قابل‌بازیابی به وضعیت و شواهد نیاز دارد</text>
  <rect x="846" y="650" width="260" height="108" rx="16" fill="#fff5e6" stroke="#e6ba75" stroke-width="2"/>
  <text class="rtl" x="976" y="678" text-anchor="middle" font-size="17" font-weight="700" fill="#8a5510">ذخیرهٔ هماهنگ</text>
  <text class="rtl" x="976" y="699" text-anchor="middle" font-size="12" fill="#80643d">coordinated snapshot</text>
  <text class="rtl" x="976" y="724" text-anchor="middle" font-size="13" fill="#80643d">مدل · بهینه‌ساز · داده‌خوان</text>
  <text class="rtl" x="976" y="744" text-anchor="middle" font-size="12" fill="#80643d">حالت تصادفی · گام سازگار</text>

  <path d="M1108 704 H1171" fill="none" stroke="#53657a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1176" y="650" width="300" height="108" rx="16" fill="#f1edff" stroke="#b49bdd" stroke-width="2"/>
  <text class="rtl" x="1326" y="678" text-anchor="middle" font-size="17" font-weight="700" fill="#5d3c92">گزارش اجرا</text>
  <text class="rtl" x="1326" y="699" text-anchor="middle" font-size="12" fill="#695882">run record · artifacts</text>
  <text class="rtl" x="1326" y="724" text-anchor="middle" font-size="12" fill="#695882">code/data/config hashes</text>
  <text class="rtl" x="1326" y="744" text-anchor="middle" font-size="12" fill="#695882">tokens · metrics · failures</text>

  <path d="M1326 763 V800 H976 V763" fill="none" stroke="#53657a" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text class="rtl" x="1150" y="829" text-anchor="middle" font-size="14" font-weight="700" fill="#31516b">پس از بازراه‌اندازی کارگرها، هویت را وارسی کن؛</text>
  <text class="rtl" x="1150" y="850" text-anchor="middle" font-size="14" font-weight="700" fill="#31516b">سپس از آخرین ذخیرهٔ معتبر ادامه بده.</text>
  <text class="rtl" x="1150" y="883" text-anchor="middle" font-size="13" fill="#64758a">راه‌اندازی دوبارهٔ پردازه، وضعیت بهینه‌ساز یا جایگاه داده را به‌تنهایی بازنمی‌سازد.</text>
</svg>
