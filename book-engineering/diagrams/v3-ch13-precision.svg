<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">دقت عددی و کاهش دقت کنترل‌شده در آموزش و استنتاج</title>
  <desc id="desc">مقایسهٔ FP32 و FP16 و BF16 و دو قالب FP8 برحسب بیت‌های علامت، نما و کسر؛ سپس دو مسیر مجزا برای mixed precision training و quantization که در هر دو، اندازه‌گیری خطا و اعتبارسنجی لازم است.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#10233f"/>
      <stop offset="1" stop-color="#203e68"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#152b45" flood-opacity=".11"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#7890ad"/>
    </marker>
    <style>
      text { font-family: "Vazirmatn", "DejaVu Sans", sans-serif; fill: #162b46; }
      .rtl { direction: ltr; unicode-bidi: plaintext; }
      .title { font-size: 34px; font-weight: 800; fill: #fff; }
      .subtitle { font-size: 17px; fill: #d5e3f4; }
      .section { font-size: 21px; font-weight: 800; }
      .card-title { font-size: 21px; font-weight: 800; }
      .small { font-size: 14px; fill: #566b83; }
      .tiny { font-size: 12px; fill: #5e738c; }
      .lane-title { font-size: 19px; font-weight: 800; }
      .box-title { font-size: 15px; font-weight: 700; }
      .box-sub { font-size: 12px; fill: #62748a; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f4f7fb"/>
  <rect x="0" y="0" width="1600" height="124" fill="url(#header)"/>
  <circle cx="1490" cy="20" r="105" fill="#5fa1de" opacity=".11"/>
  <circle cx="1400" cy="125" r="73" fill="#8a72e8" opacity=".12"/>
  <text class="rtl title" x="1535" y="58" text-anchor="end">فصل ۴۵ | دقت عددی، قالب‌ها و Quantization</text>
  <text class="rtl subtitle" x="1535" y="92" text-anchor="end">دامنهٔ نمایش، دقت نسبی، طرح scale، kernel و آزمون کیفیت؛ یک انتخاب نیستند، یک بودجهٔ مشترک‌اند.</text>

  <text class="rtl section" x="1535" y="166" text-anchor="end">۱. بیت‌های قالب شناور: range در برابر resolution</text>
  <text class="rtl small" x="1535" y="190" text-anchor="end">چیدمان: sign / exponent / fraction (stored bits) — نمایش شماتیک، نه ادعای یکسان‌بودن rounding یا پشتیبانی عملگرها</text>

  <g filter="url(#shadow)">
    <rect x="45" y="211" width="292" height="173" rx="18" fill="#fff"/>
    <rect x="349" y="211" width="292" height="173" rx="18" fill="#fff"/>
    <rect x="653" y="211" width="292" height="173" rx="18" fill="#fff"/>
    <rect x="957" y="211" width="292" height="173" rx="18" fill="#fff"/>
    <rect x="1261" y="211" width="294" height="173" rx="18" fill="#fff"/>
  </g>
  <g>
    <text class="card-title" x="191" y="245" text-anchor="middle">FP32</text>
    <text class="tiny" x="191" y="265" text-anchor="middle">۳۲ bit • 4 B • ۱ / ۸ / ۲۳</text>
    <rect x="68" y="282" width="9" height="18" rx="3" fill="#f3b542"/><rect x="80" y="282" width="60" height="18" rx="3" fill="#5798e5"/><rect x="143" y="282" width="172" height="18" rx="3" fill="#8b78dc"/>
    <text class="tiny" x="72" y="319">S</text><text class="tiny" x="103" y="319">E: دامنه</text><text class="tiny" x="226" y="319">M: دقت</text>
    <text class="small" x="191" y="356" text-anchor="middle">مرجع پرکاربرد؛ نه حساب دقیق حقیقی</text>

    <text class="card-title" x="495" y="245" text-anchor="middle">FP16</text>
    <text class="tiny" x="495" y="265" text-anchor="middle">۱۶ bit • 2 B • ۱ / ۵ / ۱۰</text>
    <rect x="373" y="282" width="9" height="18" rx="3" fill="#f3b542"/><rect x="385" y="282" width="60" height="18" rx="3" fill="#5798e5"/><rect x="448" y="282" width="123" height="18" rx="3" fill="#8b78dc"/>
    <text class="tiny" x="377" y="319">S</text><text class="tiny" x="408" y="319">E: محدودتر</text><text class="tiny" x="503" y="319">M: دقیق‌تر</text>
    <text class="small" x="495" y="356" text-anchor="middle">دقت کسری بیشتر از BF16؛ range کمتر</text>

    <text class="card-title" x="799" y="245" text-anchor="middle">BF16</text>
    <text class="tiny" x="799" y="265" text-anchor="middle">۱۶ bit • 2 B • ۱ / ۸ / ۷</text>
    <rect x="677" y="282" width="9" height="18" rx="3" fill="#f3b542"/><rect x="689" y="282" width="60" height="18" rx="3" fill="#5798e5"/><rect x="752" y="282" width="83" height="18" rx="3" fill="#8b78dc"/>
    <text class="tiny" x="681" y="319">S</text><text class="tiny" x="712" y="319">E: گسترده</text><text class="tiny" x="781" y="319">M: کوتاه‌تر</text>
    <text class="small" x="799" y="356" text-anchor="middle">range نزدیک FP32؛ گام گردکردن درشت‌تر</text>

    <text class="card-title" x="1103" y="245" text-anchor="middle">FP8 E4M3</text>
    <text class="tiny" x="1103" y="265" text-anchor="middle">۸ bit • 1 B • ۱ / ۴ / ۳</text>
    <rect x="981" y="282" width="9" height="18" rx="3" fill="#f3b542"/><rect x="993" y="282" width="60" height="18" rx="3" fill="#5798e5"/><rect x="1056" y="282" width="43" height="18" rx="3" fill="#8b78dc"/>
    <text class="tiny" x="985" y="319">S</text><text class="tiny" x="1016" y="319">E: کمتر</text><text class="tiny" x="1074" y="319">M</text>
    <text class="small" x="1103" y="356" text-anchor="middle">±۴۴۸؛ fraction بیشتر از E5M2</text>

    <text class="card-title" x="1408" y="245" text-anchor="middle">FP8 E5M2</text>
    <text class="tiny" x="1408" y="265" text-anchor="middle">۸ bit • 1 B • ۱ / ۵ / ۲</text>
    <rect x="1285" y="282" width="9" height="18" rx="3" fill="#f3b542"/><rect x="1297" y="282" width="60" height="18" rx="3" fill="#5798e5"/><rect x="1360" y="282" width="29" height="18" rx="3" fill="#8b78dc"/>
    <text class="tiny" x="1289" y="319">S</text><text class="tiny" x="1320" y="319">E: بیشتر</text><text class="tiny" x="1365" y="319">M</text>
    <text class="small" x="1408" y="356" text-anchor="middle">±۵۷٬۳۴۴؛ range بیشتر از E4M3</text>
  </g>
  <rect x="1160" y="393" width="395" height="31" rx="15" fill="#eeeaff"/>
  <text class="rtl small" x="1540" y="414" text-anchor="end" fill="#5543a5">MXFP8: در OCP MX، بلوک ۳۲تایی + scale مشترک UE8M0</text>
  <text class="rtl tiny" x="1144" y="414" text-anchor="end">برای همهٔ قالب‌ها: accumulation، edge case و کارایی را جداگانه بررسی کنید.</text>

  <rect x="45" y="443" width="1510" height="230" rx="22" fill="#eaf2fb" stroke="#d4e1f0"/>
  <rect x="64" y="458" width="420" height="38" rx="19" fill="#d6e7fa"/>
  <text class="rtl lane-title" x="468" y="484" text-anchor="end">۲. Mixed-precision training</text>
  <text class="rtl small" x="1532" y="484" text-anchor="end">autocast سیاست per-op است؛ مدل را صرفاً با `.half()` به قالب پایین تبدیل نکنید.</text>

  <g>
    <rect x="1280" y="516" width="223" height="104" rx="16" fill="#fff" stroke="#b9cee5"/>
    <rect x="1020" y="516" width="223" height="104" rx="16" fill="#fff" stroke="#b9cee5"/>
    <rect x="760" y="516" width="223" height="104" rx="16" fill="#fff" stroke="#b9cee5"/>
    <rect x="500" y="516" width="223" height="104" rx="16" fill="#fff" stroke="#b9cee5"/>
    <rect x="240" y="516" width="223" height="104" rx="16" fill="#fff" stroke="#b9cee5"/>
    <text class="rtl box-title" x="1391" y="548" text-anchor="middle">پارامترهای FP32</text>
    <text class="rtl box-sub" x="1391" y="575" text-anchor="middle">وزن مرجع / optimizer</text>
    <text class="rtl box-sub" x="1391" y="596" text-anchor="middle">بسته به روش</text>
    <text class="rtl box-title" x="1131" y="548" text-anchor="middle">AMP / autocast</text>
    <text class="rtl box-sub" x="1131" y="575" text-anchor="middle">dtype مناسب هر op</text>
    <text class="rtl box-sub" x="1131" y="596" text-anchor="middle">device + backend</text>
    <text class="rtl box-title" x="871" y="548" text-anchor="middle">FP16 یا BF16</text>
    <text class="rtl box-sub" x="871" y="575" text-anchor="middle">حساب انتخابی</text>
    <text class="rtl box-sub" x="871" y="596" text-anchor="middle">نه الزاماً همهٔ opها</text>
    <text class="rtl box-title" x="611" y="548" text-anchor="middle">backward و update</text>
    <text class="rtl box-sub" x="611" y="575" text-anchor="middle">انباشت ممکن است دقیق‌تر باشد</text>
    <text class="rtl box-sub" x="611" y="596" text-anchor="middle">GradScaler برای FP16، اگر نیاز</text>
    <text class="rtl box-title" x="351" y="548" text-anchor="middle">پایش پایداری</text>
    <text class="rtl box-sub" x="351" y="575" text-anchor="middle">loss • grad • isfinite</text>
    <text class="rtl box-sub" x="351" y="596" text-anchor="middle">کیفیت روی validation</text>
    <path d="M1270 568 H1252" stroke="#7890ad" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1010 568 H992" stroke="#7890ad" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M750 568 H732" stroke="#7890ad" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M490 568 H472" stroke="#7890ad" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <text class="rtl small" x="1530" y="649" text-anchor="end">زیرریز ≠ سرریز؛ BF16 range بزرگ‌تری از FP16 دارد، اما گام‌هایش درشت‌ترند. GradScaler هم تضمین پایداری نیست.</text>

  <rect x="45" y="696" width="1510" height="230" rx="22" fill="#f3efff" stroke="#ddd4f4"/>
  <rect x="64" y="711" width="490" height="38" rx="19" fill="#e4ddfb"/>
  <text class="rtl lane-title" x="538" y="737" text-anchor="end">۳. Quantization برای inference / QAT</text>
  <text class="rtl small" x="1532" y="737" text-anchor="end">کد کم‌بیت + پارامتر تبدیل + kernel سازگار؛ صرفاً cast یک tensor نیست.</text>
  <g>
    <rect x="1280" y="769" width="223" height="104" rx="16" fill="#fff" stroke="#cfc3ec"/>
    <rect x="1020" y="769" width="223" height="104" rx="16" fill="#fff" stroke="#cfc3ec"/>
    <rect x="760" y="769" width="223" height="104" rx="16" fill="#fff" stroke="#cfc3ec"/>
    <rect x="500" y="769" width="223" height="104" rx="16" fill="#fff" stroke="#cfc3ec"/>
    <rect x="240" y="769" width="223" height="104" rx="16" fill="#fff" stroke="#cfc3ec"/>
    <text class="rtl box-title" x="1391" y="801" text-anchor="middle">Calibration / QAT</text>
    <text class="rtl box-sub" x="1391" y="828" text-anchor="middle">دادهٔ نماینده</text>
    <text class="rtl box-sub" x="1391" y="849" text-anchor="middle">PTQ یا fake-quant</text>
    <text class="rtl box-title" x="1131" y="801" text-anchor="middle">scale + zero-point</text>
    <text class="rtl box-sub" x="1131" y="828" text-anchor="middle">per-tensor / group</text>
    <text class="rtl box-sub" x="1131" y="849" text-anchor="middle">بازه و دانه‌بندی</text>
    <text class="rtl box-title" x="871" y="801" text-anchor="middle">round + clamp</text>
    <text class="rtl box-sub" x="871" y="828" text-anchor="middle">خطای گردکردن</text>
    <text class="rtl box-sub" x="871" y="849" text-anchor="middle">سنجش saturation</text>
    <text class="rtl box-title" x="611" y="801" text-anchor="middle">کد int8 / FP8</text>
    <text class="rtl box-sub" x="611" y="828" text-anchor="middle">وزن، activation، یا هر دو</text>
    <text class="rtl box-sub" x="611" y="849" text-anchor="middle">بسته به workflow</text>
    <text class="rtl box-title" x="351" y="801" text-anchor="middle">اعتبارسنجی مقصد</text>
    <text class="rtl box-sub" x="351" y="828" text-anchor="middle">metric + latency + memory</text>
    <text class="rtl box-sub" x="351" y="849" text-anchor="middle">سخت‌افزار / نسخه</text>
    <path d="M1270 821 H1252" stroke="#8c79b8" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1010 821 H992" stroke="#8c79b8" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M750 821 H732" stroke="#8c79b8" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M490 821 H472" stroke="#8c79b8" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <rect x="45" y="946" width="1510" height="35" rx="17" fill="#172d49"/>
  <text class="rtl" x="800" y="970" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">قاعدهٔ مهندسی: ابتدا مرجع و معیار بسازید؛ سپس دقت کمتر را روی workload، backend و سخت‌افزار مقصد اندازه بگیرید.</text>
</svg>
