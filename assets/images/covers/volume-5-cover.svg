<svg xmlns="http://www.w3.org/2000/svg" width="848" height="1264" viewBox="0 0 900 1300" role="img" aria-labelledby="v5-cover-title v5-cover-desc" xml:lang="fa">
  <title id="v5-cover-title">هنر و علم ساخت هوش — جلد پنجم</title>
  <desc id="v5-cover-desc">جلد پنجم مجموعه دربارهٔ ارزیابی، کیفیت، محصول و پژوهش؛ تصویری مفهومی از ترازوی سنجش، داده‌های آزمون و کتاب باز، با زمینهٔ سرمه‌ای و جزئیات طلایی.</desc>
