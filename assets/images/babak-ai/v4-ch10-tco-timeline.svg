<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">از قیمت لحظه‌ای تا هزینهٔ کل مالکیت</title>
  <desc id="desc">نمودار مفهومی بودجهٔ محاسبات: هزینهٔ آغازین، هزینه‌های سالانه، ارزش باقیمانده و نرخ تنزیل در یک افق زمانی به TCO و NPV تبدیل می‌شوند؛ سپس فقط با خروجی هم‌ارز و پذیرفته‌شده، خرید و اجاره و ابر مقایسه می‌شوند. قیمت ابری Iowa و میانگین برق Texas با برچسب بازار جدا آمده‌اند.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07162d"/>
      <stop offset="1" stop-color="#102d4d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M1 1 L10 6 L1 11" fill="none" stroke="#70e1d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: "Vazirmatn", "Noto Sans Arabic", "DejaVu Sans", sans-serif; }
      .fa { direction: rtl; unicode-bidi: plaintext; }
      .card { fill:#142c49; stroke:#315274; stroke-width:2; }
      .muted { fill:#b7c9dc; }
      .white { fill:#f5f8fc; }
      .teal { fill:#6ee7d6; }
      .blue { fill:#93c5fd; }
      .small { font-size:24px; }
      .medium { font-size:31px; }
      .large { font-size:48px; font-weight:700; }
    </style>
  </defs>
  <rect width="1600" height="1000" rx="36" fill="url(#bg)"/>
  <path d="M80 150 H1520" stroke="#244665" stroke-width="2"/>
  <text x="800" y="82" text-anchor="middle" class="fa white large">از قیمت لحظه‌ای تا هزینهٔ کل مالکیت</text>
  <text x="800" y="126" text-anchor="middle" class="fa muted small">افق زمانی و مرز بازار را مشخص کن؛ هزینه را به خروجی معتبر پیوند بده</text>

  <g filter="url(#shadow)">
    <rect x="90" y="190" width="320" height="174" rx="22" class="card"/>
    <rect x="450" y="190" width="320" height="174" rx="22" class="card"/>
    <rect x="810" y="190" width="320" height="174" rx="22" class="card"/>
    <rect x="1170" y="190" width="340" height="174" rx="22" class="card"/>
  </g>
  <text x="250" y="238" text-anchor="middle" class="fa teal medium">پرداخت آغازین</text>
  <text x="250" y="286" text-anchor="middle" class="fa white small">خرید، نصب، راه‌اندازی</text>
  <text x="250" y="326" text-anchor="middle" class="fa muted small">یا ودیعهٔ قرارداد</text>
  <text x="610" y="238" text-anchor="middle" class="fa teal medium">هزینه‌های دوره‌ای</text>
  <text x="610" y="286" text-anchor="middle" class="fa white small">انرژی، نگهداری، اجاره</text>
  <text x="610" y="326" text-anchor="middle" class="fa muted small">ابر، شبکه، نیروی کار</text>
  <text x="970" y="238" text-anchor="middle" class="fa teal medium">افق و ریسک</text>
  <text x="970" y="286" text-anchor="middle" class="fa white small">عمر خدمت، تأخیر، خرابی</text>
  <text x="970" y="326" text-anchor="middle" class="fa muted small">ارزش باقیمانده / تنزیل</text>
  <text x="1340" y="238" text-anchor="middle" class="fa teal medium">مرز بازار</text>
  <text x="1340" y="286" text-anchor="middle" class="fa white small">منطقه، تاریخ، ارز</text>
  <text x="1340" y="326" text-anchor="middle" class="fa muted small">شامل / خارج از قیمت</text>

  <path d="M250 374 V414 H598" fill="none" stroke="#70e1d2" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M610 374 V414" fill="none" stroke="#70e1d2" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M970 374 V414 H1002" fill="none" stroke="#70e1d2" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1340 374 V414 H1002" fill="none" stroke="#70e1d2" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="500" y="430" width="600" height="116" rx="28" fill="#0c4051" stroke="url(#accent)" stroke-width="3" filter="url(#shadow)"/>
  <text x="800" y="476" text-anchor="middle" class="white large">TCO  /  NPV</text>
  <text x="800" y="519" text-anchor="middle" class="fa muted small">جمع جریان‌های هزینه در افق مشترک</text>

  <path d="M800 552 V587" fill="none" stroke="#70e1d2" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="382" y="602" width="836" height="104" rx="24" fill="#183a56" stroke="#3f6886" stroke-width="2"/>
  <text x="800" y="646" text-anchor="middle" class="fa blue medium">هزینه به ازای خروجی هم‌ارز و پذیرفته‌شده</text>
  <text x="800" y="685" text-anchor="middle" class="fa muted small">یکسان‌سازی بار، کیفیت، ظرفیت و سطح خدمت — نه صرفاً قیمت GPU</text>

  <text x="800" y="753" text-anchor="middle" class="fa white medium">جریان هزینه در طول زمان</text>
  <line x1="320" y1="820" x2="1280" y2="820" stroke="#7995ae" stroke-width="3"/>
  <g fill="#6ee7d6" stroke="#0b253a" stroke-width="4">
    <circle cx="360" cy="820" r="14"/><circle cx="650" cy="820" r="14"/><circle cx="940" cy="820" r="14"/><circle cx="1230" cy="820" r="14"/>
  </g>
  <text x="360" y="862" text-anchor="middle" class="white small">سال ۰</text>
  <text x="650" y="862" text-anchor="middle" class="white small">سال ۱</text>
  <text x="940" y="862" text-anchor="middle" class="white small">سال ۲</text>
  <text x="1230" y="862" text-anchor="middle" class="white small">پایان افق</text>
  <text x="360" y="904" text-anchor="middle" class="fa muted small">سرمایه / ودیعه</text>
  <text x="650" y="904" text-anchor="middle" class="fa muted small">هزینهٔ سالانه</text>
  <text x="940" y="904" text-anchor="middle" class="fa muted small">هزینهٔ سالانه</text>
  <text x="1230" y="904" text-anchor="middle" class="fa muted small">باقیمانده / خروج</text>
  <rect x="100" y="930" width="1400" height="46" rx="16" fill="#402f27" stroke="#a76e42" stroke-width="1.5"/>
  <text x="800" y="961" text-anchor="middle" class="fa white small">نمونه‌های این فصل: قیمت ابرِ Iowa و میانگین برقِ کل Texas دو snapshot جدا هستند؛ مقایسهٔ مستقیم نیستند.</text>
</svg>
