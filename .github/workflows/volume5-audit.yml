name: Volume 5 audit
on:
  push:
    paths:
      - '**'
      - '.github/workflows/volume5-audit.yml'
  pull_request:
  workflow_dispatch:
jobs:
  volume5-cpu-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - name: Install pinned repository dependencies and Chromium
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check published structures through chapter 66
        run: |
          python book-engineering/check_volume.py
          python book-engineering/check_volume2.py
          python book-engineering/check_volume3.py
          python book-engineering/check_volume4.py
          python book-engineering/check_volume5.py
      - name: Chapter 62 synthetic evaluation project tests
        run: |
          (cd book-engineering/projects/62-evaluation-lab && python -m unittest discover -v)
          python book-engineering/projects/62-evaluation-lab/evaluation_lab.py \
            --output /tmp/ch62-ci-results.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/ch62-ci-results.json').read_text())
          assert result['fixture_sha256'] == {
              'sample_evaluation.jsonl': '97135e669009c1ac8e3c30a33cee2fb4aa910fc1f457d32f747d29a0518c1b45',
              'training_corpus_fixture.txt': 'a0f234a212badd9120e0f2868fb28a02f6b6472bb20689e150c57ec84fa353b6',
              'human_votes_fixture.json': '216988f7f338af7f75a70425649f165d2f9e8104e8e852dbf76ef3d2f223775e',
          }
          assert result['test_case_count'] == 6
          assert result['baseline']['accuracy'] == 2/3
          assert result['candidate']['accuracy'] == 5/6
          assert result['paired_group_bootstrap']['groups'] == 3
          assert result['paired_group_bootstrap']['seed'] == 62
          assert result['human_vote_fixture']['pair_comparisons'] == 18
          assert result['overlap_screen'][0]['flagged_for_review'] is True
          assert result['scope'].startswith('Synthetic') and len(result['limitations']) == 5
          PY
      - name: Chapter 63 synthetic behavior project tests
        run: |
          (cd book-engineering/projects/63-model-behavior-lab && python -m unittest discover -v)
          python book-engineering/projects/63-model-behavior-lab/model_behavior_lab.py \
            --output /tmp/ch63-ci-results.json
          cmp /tmp/ch63-ci-results.json book-engineering/projects/63-model-behavior-lab/results.json
      - name: Chapter 64 synthetic security-control project tests
        run: |
          (cd book-engineering/projects/64-red-team-lab && python -m unittest discover -v)
          python book-engineering/projects/64-red-team-lab/red_team_lab.py \
            --output /tmp/ch64-ci-results.json
          cmp /tmp/ch64-ci-results.json book-engineering/projects/64-red-team-lab/results.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path('book-engineering/projects/64-red-team-lab')
          fixture = (root / 'synthetic_security_fixture.json').read_bytes()
          result = json.loads(Path('/tmp/ch64-ci-results.json').read_text())
          manifest = json.loads((root / 'fixture_manifest.json').read_text())
          assert hashlib.sha256(fixture).hexdigest() == '1f7183e4db3536e12afb9dd07c81042d0e13c2e7fab9312321bc4f2fed84013f'
          assert manifest['sha256'] == result['fixture_sha256']
          assert result['case_count'] == 7 and result['attack_case_count'] == 6
          assert result['benign_control_count'] == 1
          assert result['control_checks_passed'] == 7 and result['control_checks_failed'] == 0
          assert result['simulated_attack_goals_reached'] == 0
          assert result['simulated_attack_goal_rate'] == 0.0
          assert len(result['limitations']) == 6
          assert 'not a red-team test' in result['scope']
          PY
      - name: Chapter 65 synthetic governance-pack project tests
        run: |
          (cd book-engineering/projects/65-governance-lab && python -m unittest discover -v)
          python book-engineering/projects/65-governance-lab/governance_check.py \
            --output /tmp/ch65-ci-results.json
          cmp /tmp/ch65-ci-results.json book-engineering/projects/65-governance-lab/results.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path('book-engineering/projects/65-governance-lab')
          fixture = (root / 'governance_pack.json').read_bytes()
          manifest = json.loads((root / 'fixture_manifest.json').read_text())
          result = json.loads(Path('/tmp/ch65-ci-results.json').read_text())
          assert hashlib.sha256(fixture).hexdigest() == manifest['sha256'] == result['fixture_sha256']
          assert result['fixture_id'] == 'v5-ch04-governance-pack-synthetic-v1'
          assert result['risk_count'] == 4 and result['structurally_valid'] is True
          assert result['gate_status'] == 'hold' and result['release_authorized'] is False
          assert 'not a compliance audit' in result['scope']
          PY
      - name: Chapter 66 synthetic API contract and browser tests
        run: |
          python -m pip install -r book-engineering/projects/66-ai-product-api/requirements.txt
          python -m pip check
          python book-engineering/projects/66-ai-product-api/audit.py \
            --output /tmp/ch66-ci-results.json
          cmp /tmp/ch66-ci-results.json book-engineering/projects/66-ai-product-api/results.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path('book-engineering/projects/66-ai-product-api')
          fixture_hash = hashlib.sha256((root / 'synthetic_fixture.json').read_bytes()).hexdigest()
          manifest = json.loads((root / 'fixture_manifest.json').read_text())
          result = json.loads(Path('/tmp/ch66-ci-results.json').read_text())
          assert fixture_hash == manifest['sha256'] == result['fixture_sha256']
          assert result['fixture_id'] == 'v5-ch05-api-contract-synthetic-v1'
          assert result['api_case_count'] == result['api_cases_passed'] == 12
          assert result['api_cases_failed'] == 0
          assert result['frontend_case_count'] == result['frontend_cases_passed'] == 2
          assert result['frontend_cases_failed'] == 0
          assert result['external_http_requests'] == result['live_model_calls'] == result['personal_records'] == 0
          PY
      - name: Confirm volume 5 builder idempotence
        run: |
          cp data.json /tmp/v5-data-before.json
          cp sw.js /tmp/v5-sw-before.js
          cp volume-5-full-fa.md /tmp/v5-markdown-before.md
          python book-engineering/build_volume5.py
          cmp data.json /tmp/v5-data-before.json
          cmp sw.js /tmp/v5-sw-before.js
          cmp volume-5-full-fa.md /tmp/v5-markdown-before.md
      - name: Browser, responsive and offline checks
        run: |
          python book-engineering/test_volume5.py
          python book-engineering/test_mobile_layout.py
