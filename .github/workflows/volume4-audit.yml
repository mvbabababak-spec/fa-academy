name: Volume 4 audit
on:
  push:
    paths:
      - '**'
      - '.github/workflows/volume4-audit.yml'
  pull_request:
  workflow_dispatch:
jobs:
  volume4-cpu-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned repository dependencies and Chromium
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check published book structures and immutable builders
        run: |
          python book-engineering/check_volume.py
          python book-engineering/check_volume2.py
          python book-engineering/rebuild_volume3_targets.py
          python book-engineering/check_volume3.py
          python book-engineering/build_volume4.py
          python book-engineering/check_volume4.py
      - name: Chapter 47 offline data-contract tests
        run: |
          (cd book-engineering/projects/47-instruction-tuning && python -m unittest discover -v)
          python book-engineering/projects/47-instruction-tuning/sft_experiment.py \
            --mode audit --data book-engineering/projects/47-instruction-tuning/sample_sft.jsonl \
            --output /tmp/ch47-ci-audit
          python -c "import json; p=json.load(open('/tmp/ch47-ci-audit/run.json')); assert p['status']=='validated_only' and p['training_performed'] is False and p['model_downloaded_or_loaded'] is False and p['data']['records']==15 and p['data']['groups']==14"
      - name: Chapter 48 offline PEFT algebra tests
        run: |
          (cd book-engineering/projects/48-peft-lab && python -m unittest discover -v)
          python book-engineering/projects/48-peft-lab/peft_lab.py \
            --mode audit --fixture book-engineering/projects/48-peft-lab/sample_layers.json \
            --output /tmp/ch48-ci-audit
          python -c "import json; p=json.load(open('/tmp/ch48-ci-audit/run.json')); assert p['status']=='validated_only' and p['training_performed'] is False and p['model_downloaded'] is False and p['totals']['base_weight_parameters_in_fixture']==5120 and p['totals']['lora_trainable_parameters_in_fixture']==832 and p['totals']['quantized_weight_payload_lower_bound_bytes']==2560"
          python book-engineering/projects/48-peft-lab/peft_lab.py \
            --mode toy-lora --output /tmp/ch48-ci-toy
          python -c "import json; p=json.load(open('/tmp/ch48-ci-toy/run.json')); assert p['status']=='synthetic_demo_completed' and p['model_downloaded'] is False and p['device']=='cpu' and p['final_mse'] < p['initial_mse'] and p['base_parameters_trainable'] is False and p['merge_max_abs_error'] < 1e-5"
      - name: Chapter 49 offline preference objective tests
        run: |
          (cd book-engineering/projects/49-preference-lab && python -m unittest discover -v)
          python book-engineering/projects/49-preference-lab/preference_lab.py \
            --mode audit --fixture book-engineering/projects/49-preference-lab/sample_preferences.jsonl \
            --output /tmp/ch49-ci-audit
          python -c "import json; p=json.load(open('/tmp/ch49-ci-audit/run.json')); assert p['status']=='validated_only' and p['training_performed'] is False and p['model_loaded'] is False and p['model_downloaded'] is False and p['records']==12 and p['group_count']==6 and p['sha256']=='629b48e6a9c3f3a8d6c336eadbb1f3833b988348c1b11f1022221db121fc21bb'"
          python book-engineering/projects/49-preference-lab/preference_lab.py \
            --mode toy-dpo --output /tmp/ch49-ci-toy --steps 80 --seed 49
          python -c "import json; p=json.load(open('/tmp/ch49-ci-toy/run.json')); assert p['status']=='synthetic_demo_completed' and p['model_loaded'] is False and p['model_downloaded'] is False and p['device']=='cpu' and p['final_dpo_loss'] < p['initial_dpo_loss'] and p['policy_chosen_probability'] > 0.5"
      - name: Chapter 50 synthetic reasoning-data checks
        run: |
          (cd book-engineering/projects/50-synthetic-reasoning && python -m unittest discover -v)
          python book-engineering/projects/50-synthetic-reasoning/reasoning_lab.py \
            --mode audit --fixture book-engineering/projects/50-synthetic-reasoning/sample_traces.jsonl \
            --output /tmp/ch50-ci-audit
          python -c "import json; p=json.load(open('/tmp/ch50-ci-audit/run.json')); assert p['status']=='synthetic_fixture_audit_complete' and p['training_performed'] is False and p['language_model_loaded'] is False and p['model_downloaded'] is False and p['records']==12 and p['groups']==6 and p['sha256']=='1654621020c9dd2175cf0d7f66cb14ed78a3d192667c7e79ce7571219f47a075' and [p['split'][name]['records'] for name in ('train','validation','test')]==[8,2,2]"
          python book-engineering/projects/50-synthetic-reasoning/reasoning_lab.py \
            --mode demo --fixture book-engineering/projects/50-synthetic-reasoning/sample_traces.jsonl \
            --output /tmp/ch50-ci-demo
          python -c "import json; p=json.load(open('/tmp/ch50-ci-demo/run.json')); assert p['status']=='synthetic_math_helpers_smoke_test' and p['training_performed'] is False and p['language_model_loaded'] is False and p['model_downloaded'] is False and p['student_gradient_is_finite'] is True and p['vote_winner']=='125' and p['candidate_budget']==5"
      - name: Chapter 51 synthetic vision and alignment checks
        run: |
          (cd book-engineering/projects/51-vision-lab && python -m unittest discover -v)
          python book-engineering/projects/51-vision-lab/vision_lab.py \
            --mode audit --fixture book-engineering/projects/51-vision-lab/sample_embeddings.json \
            --output /tmp/ch51-ci-audit
          python -c "import json; p=json.load(open('/tmp/ch51-ci-audit/run.json')); assert p['status']=='synthetic_image_text_fixture_audit_complete' and p['training_performed'] is False and p['image_files_loaded'] is False and p['pretrained_model_loaded'] is False and p['model_downloaded'] is False and p['image_records']==4 and p['text_records']==4 and p['groups']==4 and p['sha256']=='aba309bb1b3e69443802190b988a21e0432109c01b777f4f58fe11f992936522'"
          python book-engineering/projects/51-vision-lab/vision_lab.py \
            --mode demo --fixture book-engineering/projects/51-vision-lab/sample_embeddings.json \
            --output /tmp/ch51-ci-demo
          python -c "import json; p=json.load(open('/tmp/ch51-ci-demo/run.json')); assert p['status']=='synthetic_patch_and_embedding_smoke_test' and p['training_performed'] is False and p['image_files_loaded'] is False and p['pretrained_model_loaded'] is False and p['model_downloaded'] is False and p['patch_fixture']['reconstruction_exact'] is True and p['image_gradient_is_finite'] is True and p['image_to_text_retrieval']['recall_at_k']['1']==1.0 and p['text_to_image_retrieval']['recall_at_k']['1']==1.0 and p['attention_pair_ratio_448_to_224']==15.878404493802984"
      - name: Chapter 52 synthetic audio and transcript-metric checks
        run: |
          (cd book-engineering/projects/52-audio-lab && python -m unittest discover -v)
          python book-engineering/projects/52-audio-lab/audio_lab.py \
            --mode audit --fixture book-engineering/projects/52-audio-lab/sample_transcripts.json \
            --output /tmp/ch52-ci-audit
          python -c "import json; p=json.load(open('/tmp/ch52-ci-audit/run.json')); assert p['status']=='synthetic_transcript_fixture_audit_complete' and p['training_performed'] is False and p['audio_recordings_loaded'] is False and p['speech_model_loaded'] is False and p['model_downloaded'] is False and p['fixture']['records']==3 and p['fixture']['sha256']=='46abd6b35e1481e0b3796522056d25168f7cc1823e0059fafc9a544dd5fdf347'"
          python book-engineering/projects/52-audio-lab/audio_lab.py \
            --mode demo --fixture book-engineering/projects/52-audio-lab/sample_transcripts.json \
            --output /tmp/ch52-ci-demo
          python -c "import json; p=json.load(open('/tmp/ch52-ci-demo/run.json')); assert p['status']=='synthetic_audio_framing_and_transcript_metric_demo_complete' and p['training_performed'] is False and p['audio_recordings_loaded'] is False and p['speech_model_loaded'] is False and p['model_downloaded'] is False and p['analytic_tone']['sample_count']==1600 and p['analytic_tone']['complete_frames_without_tail_padding']==8 and p['analytic_tone']['first_frame_peak_frequency_hz']==440.0 and p['transcript_metrics']['wer']['error_rate']==3/11 and p['transcript_metrics']['sentence_macro_wer']==0.21666666666666667"
      - name: Chapter 53 synthetic diffusion fixture and sampler checks
        run: |
          (cd book-engineering/projects/53-diffusion-lab && python -m unittest discover -v)
          python book-engineering/projects/53-diffusion-lab/diffusion_lab.py \
            --mode audit --fixture book-engineering/projects/53-diffusion-lab/sample_mixture.json \
            --output /tmp/ch53-ci-audit
          python -c "import json; p=json.load(open('/tmp/ch53-ci-audit/run.json')); assert p['status']=='synthetic_diffusion_fixture_audit_complete' and p['training_performed'] is False and p['neural_model_loaded'] is False and p['model_downloaded'] is False and p['image_files_loaded'] is False and p['video_files_loaded'] is False and p['fixture']['components']==4 and p['fixture']['sha256']=='7646ab0c0d8cee8fdbf3e29ac88ce9e37b181859e0ff34935f6af7bbe28b208b'"
          python book-engineering/projects/53-diffusion-lab/diffusion_lab.py \
            --mode demo --fixture book-engineering/projects/53-diffusion-lab/sample_mixture.json \
            --output /tmp/ch53-ci-demo --steps 200 --samples 64 --seed 53
          python -c "import json; p=json.load(open('/tmp/ch53-ci-demo/run.json')); assert p['status']=='analytic_synthetic_mixture_ddpm_demo_complete' and p['training_performed'] is False and p['neural_model_loaded'] is False and p['model_downloaded'] is False and p['image_files_loaded'] is False and p['video_files_loaded'] is False and p['analytic_score_used'] is True and p['sampling']['timesteps']==200 and p['sampling']['sample_count']==64 and p['sampling']['seed']==53 and p['sampling']['terminal_alpha_bar']==0.002080618226191632 and p['nearest_synthetic_center_counts']=={'southwest':19,'northwest':17,'southeast':16,'northeast':12}"
      - name: Confirm volume 4 builder idempotence
        run: |
          cp data.json /tmp/v4-data-before.json
          cp volume-4-full-fa.md /tmp/v4-markdown-before.md
          python book-engineering/build_volume4.py
          cmp data.json /tmp/v4-data-before.json
          cmp volume-4-full-fa.md /tmp/v4-markdown-before.md
      - name: Browser, responsive, exact-appendix and offline checks
        run: |
          python book-engineering/test_volume4.py
          python book-engineering/test_mobile_layout.py
