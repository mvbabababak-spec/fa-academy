name: Volume 3 audit
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  volume3-cpu-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned repository dependencies (Python 3.13)
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check published book structures
        run: |
          python book-engineering/check_volume.py
          python book-engineering/check_volume2.py
          python book-engineering/rebuild_volume3_targets.py
          python book-engineering/check_volume3.py
      - name: Volume 3 chapter project tests
        run: |
          (cd book-engineering/projects/33-tokenization && python -m unittest discover -v)
          (cd book-engineering/projects/34-attention && python -m unittest discover -v)
          (cd book-engineering/projects/35-self-attention && python -m unittest discover -v)
          (cd book-engineering/projects/36-position-normalization && python -m unittest discover -v)
          (cd book-engineering/projects/37-encoder-decoder && python -m unittest discover -v)
          (cd book-engineering/projects/38-long-context && python -m unittest discover -v)
          (cd book-engineering/projects/39-multimodal-transformer && python -m unittest discover -v)
          (cd book-engineering/projects/40-small-data-project && python -m unittest discover -v)
          (cd book-engineering/projects/41-first-language-model && python -m unittest discover -v)
          (cd book-engineering/projects/42-mini-gpt-design && python -m unittest discover -v)
          python book-engineering/projects/42-mini-gpt-design/mini_gpt_design.py --context-sweep
          (cd book-engineering/projects/43-corpus-audit && python -m unittest discover -v)
          python book-engineering/projects/43-corpus-audit/corpus_audit.py --output /tmp/ch43-audit
          (cd book-engineering/projects/44-pretraining && python -m unittest discover -v)
          python book-engineering/projects/40-small-data-project/small_corpus.py \
            --manifest book-engineering/projects/40-small-data-project/sample_corpus.jsonl \
            --output /tmp/ch44-ci-data --seed 40
          python book-engineering/projects/44-pretraining/pretraining_run.py \
            --data-dir /tmp/ch44-ci-data --output-dir /tmp/ch44-ci-full \
            --total-updates 12 --microbatch-size 8 --gradient-accumulation-steps 2 \
            --peak-lr 0.01 --warmup-updates 3 --min-lr-ratio 0.1 \
            --evaluation-every 3 --checkpoint-every 4 --seed 44
          python book-engineering/projects/44-pretraining/pretraining_run.py \
            --data-dir /tmp/ch44-ci-data --output-dir /tmp/ch44-ci-resume \
            --total-updates 12 --microbatch-size 8 --gradient-accumulation-steps 2 \
            --peak-lr 0.01 --warmup-updates 3 --min-lr-ratio 0.1 \
            --evaluation-every 3 --checkpoint-every 4 --seed 44 --stop-after 6
          python -c "import json; m=json.load(open('/tmp/ch44-ci-resume/metrics.json')); assert m['status']=='partial' and m['test_once_after_training']==0 and m['test_metrics'] is None"
          python book-engineering/projects/44-pretraining/pretraining_run.py \
            --data-dir /tmp/ch44-ci-data --output-dir /tmp/ch44-ci-resume \
            --total-updates 12 --microbatch-size 8 --gradient-accumulation-steps 2 \
            --peak-lr 0.01 --warmup-updates 3 --min-lr-ratio 0.1 \
            --evaluation-every 3 --checkpoint-every 4 --seed 44 \
            --resume /tmp/ch44-ci-resume/checkpoint-latest.pt
          cmp /tmp/ch44-ci-full/metrics.json /tmp/ch44-ci-resume/metrics.json
          cmp /tmp/ch44-ci-full/history.json /tmp/ch44-ci-resume/history.json
          cmp /tmp/ch44-ci-full/loss_curve.svg /tmp/ch44-ci-resume/loss_curve.svg
          test -s /tmp/ch44-ci-full/loss_curve.svg
          test -s /tmp/ch44-ci-resume/loss_curve.svg
          (cd book-engineering/projects/45-precision && python -m unittest discover -v)
          python book-engineering/projects/45-precision/precision_lab.py --output /tmp/ch45-precision.json
          python -c "import json; p=json.load(open('/tmp/ch45-precision.json')); assert p['runtime']['torch_version'].startswith('2.6.') and p['cpu_bf16_autocast']['finite_output'] and p['quantization']['calibration_shift']['result']['saturation_count']==2"
          (cd book-engineering/projects/46-scale-training && python -m unittest discover -v)
          python book-engineering/projects/46-scale-training/scaling_lab.py --output /tmp/ch46-scaling.json
          python -c "import json; p=json.load(open('/tmp/ch46-scaling.json')); a=p['activation_checkpoint_probe']; d=p['distributed_probe']; assert a['saved_tensor_bytes_baseline'] > a['saved_tensor_bytes_rematerialized'] and max(a['max_abs_output_delta'],a['max_abs_input_gradient_delta'],a['max_abs_parameter_gradient_delta']) < 1e-6 and d['local_sample_counts']==[3,2] and d['max_abs_gradient_delta'] < 1e-6"
      - name: Confirm volume 3 builder idempotence
        run: |
          cp data.json /tmp/v3-data-before.json
          cp volume-3-full-fa.md /tmp/v3-markdown-before.md
          python book-engineering/build_volume3.py
          cmp data.json /tmp/v3-data-before.json
          cmp volume-3-full-fa.md /tmp/v3-markdown-before.md
      - name: Browser, search, responsive and offline checks
        run: |
          python book-engineering/test_volume2.py
          python book-engineering/test_volume3.py
          python book-engineering/test_mobile_layout.py
